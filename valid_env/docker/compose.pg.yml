# ⚠️ PC·단독 시험 전용 — 공유 pgvector가 이미 떠 있는 서버에서는 이 compose를 띄우지 말 것(포트 충돌·이중 기동).
#    서버에서는 기존 공유 pgvector/OpenViking을 그대로 쓴다.
#    이 컨테이너는 막 띄운 새 PG라 vector 확장이 아직 없다 — 처음 한 번 `dbtool up --create-extension`으로 직접 생성.
#    공유 PG에서는 절대 켜지 말 것(관리자가 설치하는 것, 우리가 만들지 않음).
#
# 개발 서버 PostgreSQL + pgvector (폐쇄망) — 이미지는 반입 자산에서:
#   dev_server_pgvector 브랜치 ZIP → 조각 합치기·sha256 확인 → docker load -i pgvector-pg16.tar.gz
#   (pgvector/pgvector:pg16 = PostgreSQL 16.15 + pgvector 0.8.6)
#   PG_PASSWORD=<비밀번호> docker compose -f valid_env/docker/compose.pg.yml up -d
# 접속 값은 .env(PG_HOST·PG_PORT·PG_DB·PG_USER·PG_PASSWORD·PG_SCHEMA)와 같게. 비밀번호는 .env에만(커밋 금지).
services:
  postgres:                                           # PostgreSQL 16 서버(pgvector 확장이 미리 든 이미지) — 일반 PostgreSQL로도 사용
    image: pgvector/pgvector:pg16
    container_name: rag-postgres                       # 데이터는 볼륨 rag_pgdata에 남는다
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-rag}
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 필요}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"   # 기본은 개발 서버 안에서만 접속
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    # 메모리·병렬 설정 = 고정값(개발 서버 RHEL 9.6 · 4 vCPU · 32 GB 기준 — 바꾸려면 이 파일을 고침). 다른 서버는 물리 메모리의 대략
    #   shared_buffers 1/8 · effective_cache_size 3/8 · maintenance_work_mem 1/16(HNSW 생성) · shm ≥ maintenance_work_mem + 1g
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=64MB
               -c maintenance_work_mem=2GB -c max_parallel_maintenance_workers=2
               -c max_parallel_workers_per_gather=2 -c max_connections=50
    shm_size: 3g                                        # 병렬 HNSW 생성 공유 메모리(≥ maintenance_work_mem)
    mem_limit: 12g                                      # 컨테이너 메모리 상한 — 다른 서비스(OpenViking·Gitea·파이프라인)와 같이 쓰므로
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  rag_pgdata:
