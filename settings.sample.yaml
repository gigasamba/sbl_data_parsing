# settings.sample.yaml — 설정 파일 구조와 설명(값 없음). 생성: python -m common.config.sample (손으로 고치지 않음)
# 실제 파일은 이 파일을 복사해 값을 채운다 — PC: 저장소 루트 settings.yaml(RUN_ENV=local, 권한 600) · 서버: SETTINGS_FILE이 가리키는 자리
# ($SERVER_ENV_DIR/settings.yaml — 주인 UID 10001·권한 640, 컨테이너 사용자가 읽게: docs/operations/release-and-patch.md §5-4 · refactor.md C-09).
# 비운 칸(값 없음)·빈 글자 ''은 코드 기본값을 쓴다(기본값이 없는 글자 칸·[빈 글자 유지] 칸만 ''이 빈 글자 — 옛 env `X=`과 같게). 글자 칸에 쓴 yes·no·1·0은 쓴 글자 그대로.
# 켜기 칸은 true·false. 판정 꼴 표시([켬: 1만]·[끔: 0만]·[끔: ''·0·none·false])가 있는 칸은 YAML에 true·false·0·1만 — yes·on 등은
# 검증 오류(덮기 파일 overrides로 줄 때만 옛 env 판정 꼴 그대로). [auto = 비움] 칸은 auto가 "계산"(코드 기본).
# 각 앱은 common + 자기 절(pipeline 또는 mcp)만 읽는다. 비밀 칸은 출력·로그·오류 메시지에 나오지 않는다.
# 주석: 설명 · env=옛 환경변수 이름(덮기 파일 overrides·migrate가 씀 — S7e2부터 env로 준 값은 읽지 않음) · 형식 · 기본값 · [엔진 지문]/[인계 지문] =
#       그 칸을 읽는 파일이 지문에 들어가 env로도 계속 내준다(영구 다리) · [호스트] = compose·systemd·셸이 `python -m common.config.export`로 꺼내 씀.
# 덮기 파일(S7e2): 최상위 base(원본 설정 파일 경로)·overrides({옛 env 이름: 글자})만 든 yaml — 한 번 실행에 몇 칸만 바꿀 때(python -m common.config.overrides).
# 분류표: docs/refactoring/refactor_plan.md 부록 D
# [서버 옛 값: …] = 옛 옵션 카탈로그(options.conf — S7e2에 지움)·옛 서버 compose environment 기본값이 서버 컨테이너에 주던 값 — 코드 기본값과 결과가
#       다른 칸(C-39·C-45, 사용자 10-27·10-28). 서버(·PC) 설정 파일로 옮길 때 지금 동작을 지키려면 이 값을 적는다(run_mode: prod는 모든 환경 — C-43 · 빠뜨리면 PG 연결 실패 때 문서 대장·정형 저장소가 SQLite로 조용히 대체됨 — C-54).
#       ''는 빈 글자로 적어야 결과가 같은 칸(빈 글자 유지 칸·이미지 기본값이 있는 칸 — VS7e1 R-4). 옮긴 뒤 `python -m common.config.migrate --compare`로 확인.


# ══════════════════════════════════════════════════════════════════════════════════════════════
# 1. 필수 입력 — 이 블록을 settings.yaml로 복사해 값을 채운다. 칸마다 [필수: 공통](PC·서버) · [필수: 서버] · [필수: PC].
#    서버 필수 칸을 PC에서 비우면 그 기능(EDW·Object Storage·RDB·게시 등)만 꺼진다. 비밀 칸은 settings.yaml에만.
# ══════════════════════════════════════════════════════════════════════════════════════════════

common:
  run_env:  # [필수: 공통] 실행 환경 — local(PC·valid_env 기준)·dev·prd(서버, 외부 모델 거부). env RUN_ENV가 이 값을 이김 · 기본 없음 · 값: local·dev·prd 중 하나 · env=RUN_ENV
  connections:
    object_storage:
      access_key:  # [필수: 서버] Object Storage(S3) 액세스 키 · 값: 비밀 글자 · env=OS_ACCESS_KEY [비밀]
      endpoint:  # [필수: 서버] Object Storage(S3 호환) 엔드포인트 URL — 비면 boto3 기본 · 기본 없음 · 값: URL · env=OS_ENDPOINT
      secret_key:  # [필수: 서버] Object Storage(S3) 시크릿 키 · 값: 비밀 글자 · env=OS_SECRET_KEY [비밀]
    pg:
      db:  # [필수: 공통] PostgreSQL 데이터베이스 이름 · 기본 rag · 값: 경로 · env=PG_DB
      host:  # [필수: 공통] PostgreSQL 서버 주소 — PG_HOST·PG_PORT·PG_CONN_FILE이 모두 비면 docker ps로 pgvector를 자동 탐지, 그래도 없으면 127.0.0.1(common/store/pg.py) · 기본 없음 · 값: 호스트 이름·IP · env=PG_HOST
      password:  # [필수: 공통] PostgreSQL 비밀번호 · 값: 비밀 글자 · env=PG_PASSWORD [비밀]
      port:  # [필수: 공통] PostgreSQL 포트 — 비면 자동 탐지(PG_HOST 설명), 그래도 없으면 5432 · 기본 없음 · 값: 1~65535 · env=PG_PORT
      db_schema:  # [필수: 공통] pgvector 기본 스키마 이름(소문자·숫자·_) · 기본 없음 · 값: 글자 · env=PG_SCHEMA
      user:  # [필수: 공통] PostgreSQL 접속 계정 이름 · 기본 rag · 값: 글자 · env=PG_USER
    rdb:
      database:  # [필수: 서버] EDW 데이터베이스 이름 · 기본 없음 · 값: 글자 · env=RDB_DATABASE
      host:  # [필수: 서버] EDW 서버 주소(호스트) · 기본 없음 · 값: 호스트 이름·IP · env=RDB_HOST
      read:
        password:  # [필수: 서버] EDW 읽기 계정 비밀번호 · 값: 비밀 글자 · env=RDB_READ_PASSWORD [비밀]
        user:  # [필수: 서버] EDW 읽기 계정 이름 — 원천 목록·FileStorageMap·ParsingMeta 조회·query_edw(검색 MCP는 이 계정만) · 기본 없음 · 값: 글자 · env=RDB_READ_USER
      write:
        password:  # [필수: 서버] EDW 쓰기 계정 비밀번호 · 값: 비밀 글자 · env=RDB_WRITE_PASSWORD [비밀]
        user:  # [필수: 서버] EDW 쓰기 계정 이름 — ParsingMeta 게시(INSERT·UPDATE)만 · 기본 없음 · 값: 글자 · env=RDB_WRITE_USER
  models:
    embed:
      api_key:  # [필수: 공통] 임베딩 엔드포인트 API 키(있을 때만 Authorization 헤더로 보냄) · 값: 비밀 글자 · env=EMBED_API_KEY [비밀]
      base_url:  # [필수: 공통] 임베딩 엔드포인트 주소(OpenAI 호환 …/v1) · 기본 없음 · 값: URL · env=EMBED_BASE_URL
      model:  # [필수: 공통] 임베딩 모델 이름(색인과 같아야 함 — 질의 임베딩·캐시 열쇠에도 씀) · 기본 없음 · 값: 글자 · env=EMBED_MODEL
    guard:
      no_paid_calls:  # [필수: PC] =1이면 외부(유료) 주소 호출 자체를 거부 · 기본 false · 값: true·false · env=NO_PAID_CALLS [켬: 1만]
    llm:
      api_key:  # [필수: 서버] LLM 엔드포인트 API 키(있을 때만 사용) · 값: 비밀 글자 · env=LLM_API_KEY [비밀]
      base_url:  # [필수: 서버] LLM 엔드포인트 주소(OpenAI 호환 …/v1) · 기본 없음 · 값: URL · env=LLM_BASE_URL
      model:  # [필수: 서버] LLM 모델 이름 · 기본 없음 · 값: 글자 · env=LLM_MODEL
    vlm:
      api_key:  # [필수: 서버] VLM 엔드포인트 API 키(있을 때만) · 값: 비밀 글자 · env=VLM_API_KEY [엔진 지문] [비밀]
      base_url:  # [필수: 서버] VLM 엔드포인트 주소(OpenAI 호환 …/v1) · 기본 없음 · 값: URL · env=VLM_BASE_URL [엔진 지문]
      model:  # [필수: 서버] VLM 모델 이름 · 기본 없음 · 값: 글자 · env=VLM_MODEL [엔진 지문]
  paths:
    config_dir:  # [필수: 서버] 서버 설정 폴더(코드 폴더 밖) — 호스트 스크립트가 settings.yaml을 여기서 찾음(원천 목록 sources.json 덮어쓰기는 S8b에 없앰 — 서버는 판 표) · 기본 없음 · 값: 호스트 이름·IP · env=SERVER_ENV_DIR
    doc_dir:  # [필수: 서버] 원본 문서 폴더 — 원본 위치 주소·파싱 입력의 기준(pipeline 이미지 안 기본 /data/docs — 옛 Dockerfile ENV, B-2) · 기본 없음 · 값: 경로 · env=DOC_DIR [인계 지문]
  store:
    run_mode:  # [필수: 공통] 실행 모드 prod|test — pipeline --mode 기본, prod이면 PG 실패 시 SQLite 대체 금지·VLM 시간 완화 · 기본 없음 · 값: prod·test 중 하나 · env=RUN_MODE [서버 옛 값: prod]
  text:
    source_uri_prefix:  # [필수: 서버] 원본 위치 주소의 접두어(예: s3://버킷/접두 · file:///srv/rag/docs) · 기본 없음 · 값: 글자 · env=SOURCE_URI_PREFIX [인계 지문]

pipeline:
  extract:
    input_source:  # [필수: 서버] 파싱 원본 위치: 폴더·s3://버킷/접두·rdb:csv:경로·rdb:표 · 기본 없음 · 값: 경로 · env=PARSE_SOURCE
  host:
    image:  # [필수: 서버] data-pipeline 이미지 이름:태그(compose 필수 변수) · 기본 없음 · 값: 글자 · env=DATA_PIPELINE_IMAGE [호스트]
  load:
    publish:
      bucket:  # [필수: 서버] publish 대표 결과 업로드 Object Storage 버킷 이름(file://<폴더>면 로컬 가짜 저장소) · 기본 없음 · 값: 경로 · env=PM_BUCKET
      prefix:  # [필수: 서버] 버킷 안 업로드 경로 접두 · 기본 없음 · 값: 경로 · env=PM_PREFIX
  service:
    parse_mcp:
      token:  # [필수: 서버] parse MCP 서비스 Bearer 토큰(MCP 서버 MCP_TOKEN과 같은 값) · 값: 비밀 글자 · env=PARSE_MCP_TOKEN [비밀]
    trigger:
      token:  # [필수: 서버] 트리거 서버 Bearer 토큰 — 필수(없으면 시작 거부) · 값: 비밀 글자 · env=TRIGGER_TOKEN [비밀]

mcp:
  host:
    image:  # [필수: 서버] mcp-server 컨테이너 이미지 이름:태그 · 기본 없음 · 값: 글자 · env=MCP_SERVER_IMAGE [호스트]
  parse_proxy:
    token:  # [필수: 서버] parse_document가 작업 서비스(mcp_parse_service)를 부를 때 쓰는 토큰 · 값: 비밀 글자 · env=PARSE_SERVICE_TOKEN [비밀]
  server:
    host:  # [필수: 서버] MCP 서버 바인드 주소 — auto면 컨테이너 자기 사설 IP · 기본 127.0.0.1 · 값: 127.0.0.1·auto(컨테이너 사설 IP)·사설 IP — 0.0.0.0은 거부 · env=MCP_HOST
    store:  # [필수: 서버] 검색 저장소 종류 — pg 또는 local, 비우면 자동 탐지(Docker pgvector → 없으면 로컬 묶음) · 기본 없음 · 값: pg·local 중 하나 또는 비움(자동 탐지) · env=MCP_STORE [서버 옛 값: pg]
    token:  # [필수: 서버] MCP 서버 Bearer 토큰(비루프백 바인드면 필수) · 값: 비밀 글자 · env=MCP_TOKEN [비밀]

# ══════════════════════════════════════════════════════════════════════════════════════════════
# 2. 옵션(설정) — 기능 켬/끔 · 선택값 · 경로 · 접속 · 운영값(동시성·시간·용량). 기본값이 있어 비워 두면 된다.
# 3. 파라미터 — 결과(파싱·청크·검색 순위)를 바꾸는 값. 바꾸면 같은 문서에서도 결과가 달라진다(평가로 확인 뒤 바꿈).
#    줄 모양: 칸 경로:  # 설명 · 기본 <값> · 값: <입력 가능한 값> · env=<옛 이름> [표시].
#    값: = 형식(코드가 검증 — true·false·정수·포트 등)과 설명에서 뽑은 범위·선택지. 숫자 범위는 안내이고 코드가 막지는 않는다.
#    바꿀 칸만 위 1의 같은 절(common·pipeline·mcp) 아래 같은 자리에 넣는다
#    (예: pipeline.transform.structure.chunk_size → pipeline: / transform: / structure: / chunk_size: 900).
#    같은 최상위 절을 두 번 쓰지 않는다 — YAML은 뒤의 절이 앞의 절을 통째로 덮는다.
# ══════════════════════════════════════════════════════════════════════════════════════════════

# ─── 2-1. 공통 — 접속·저장소·글자 처리 (21칸) ───
#   common.connections.object_storage.region:  # Object Storage 리전 이름 · 기본 us-east-1 · 값: 글자 · env=OS_REGION
#   common.connections.object_storage.verify_tls:  # TLS 인증서 검증(1=검증, 0=끔, 그 밖 문자열=CA 파일 경로) · 기본 1 · 값: 1(검증)·0(끔)·CA 파일 경로 · env=OS_VERIFY_TLS [빈 글자 유지]
#   common.connections.parsing_meta.table:  # parsing-meta를 쓸 EDW 표 이름(스키마.표, 영문·숫자·_) · 기본 AI.ParsingMeta · 값: 글자 · env=PM_TABLE [빈 글자 유지]
#   common.connections.pg.conn_file:  # PostgreSQL 접속 정보를 KEY=VALUE로 담은 파일 경로(환경변수가 덮음) · 기본 없음 · 값: 경로 · env=PG_CONN_FILE
#   common.connections.pg.connect_timeout:  # PostgreSQL 연결 시도 제한 시간 · 기본 10 · 값: 0 이상 정수(초) · env=PG_CONNECT_TIMEOUT
#   common.connections.pg.pool_max:  # 검색 MCP PostgreSQL 연결 풀 최대 연결 수 · 기본 8 · 값: 0 이상 정수 · env=PG_POOL_MAX
#   common.connections.pg.standin_dir:  # PG 접속 정보가 없을 때 쓰는 로컬 대체 DB(sqlite) 폴더 · 기본 없음 · 값: 경로 · env=PG_STANDIN_DIR
#   common.connections.rdb.connect_kwargs:  # EDW pymssql 연결에 더할 추가 인자(JSON 객체 — TLS·로그인 시간 등) · 값: 비밀 글자 · env=RDB_CONNECT_KWARGS [비밀]
#   common.connections.rdb.port:  # EDW 포트 · 기본 1433 · 값: 1~65535 · env=RDB_PORT
#   common.connections.rdb.sqlite:  # 시험용 가짜 EDW(SQLite 파일 하나 — 모든 표) — 있으면 실제 EDW 대신 씀 · PC(RUN_ENV=local) 전용, 서버에서는 시작 거부 · 기본 없음 · 값: 경로 · env=RDB_SQLITE
#   common.store.doc_registry:  # 문서 대장(doc_registry) 사용 — =0이면 끄고 필터 없이 동작 · 기본 true · 값: true·false · env=DOC_REGISTRY [끔: ''·0·none·false]
#   common.store.registry_editions:  # 대장 '판 비교'(지문 기록·판 연결·내용 그룹) — =0이면 끄고 이전 동작 · 기본 true · 값: true·false · env=REGISTRY_EDITIONS [끔: ''·0·none·false]
#   common.store.registry_etag_md5:  # ETag가 MD5 형식이면 그것만으로 '날짜만 바뀜'으로 확정 — =0이면 항상 원본 바이트 대조 · 기본 true · 값: true·false · env=REGISTRY_ETAG_MD5 [끔: ''·0·none·false]
#   common.store.registry_retry_max:  # 실패 문서 재시도 허용 기간(일) — 0이면 무제한 · 기본 7 · 값: 0 이상 정수 (0 = 무제한) · env=REGISTRY_RETRY_MAX
#   common.store.struct_backend:  # 정형 저장소 종류 pg|sqlite|tsql · 기본 pg · 값: pg·sqlite·tsql 중 하나 · env=STRUCT_BACKEND [빈 글자 유지]
#   common.store.struct_db:  # 정형 저장소 SQLite 파일 경로(STRUCT_BACKEND=sqlite일 때·PG 대체 시) · 기본 없음 · 값: 경로 · env=STRUCT_DB
