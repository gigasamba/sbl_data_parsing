# settings.sample.yaml — 설정 파일 구조와 설명(값 없음). 생성: python -m common.config.sample (손으로 고치지 않음)
# 실제 파일은 이 파일을 복사해 값을 채운다 — PC: 저장소 루트 settings.yaml(RUN_ENV=local, 권한 600) · 서버: SETTINGS_FILE이 가리키는 자리
# ($SERVER_ENV_DIR/settings.yaml — 주인 UID 10001·권한 640, 컨테이너 사용자가 읽게: docs/operations/release-and-patch.md §5-4 · refactor.md C-09).
# 비운 칸(값 없음)·빈 글자 ''은 코드 기본값을 쓴다(기본값이 없는 글자 칸·[빈 글자 유지] 칸만 ''이 빈 글자 — 옛 env `X=`과 같게). 글자 칸에 쓴 yes·no·1·0은 쓴 글자 그대로.
# 켜기 칸은 true·false. 판정 꼴 표시([켬: 1만]·[끔: 0만]·[끔: ''·0·none·false])가 있는 칸은 YAML에 true·false·0·1만 — yes·on 등은
# 검증 오류(덮기 파일 overrides로 줄 때만 옛 env 판정 꼴 그대로). [auto = 비움] 칸은 auto가 "계산"(코드 기본).
# 각 앱은 common + 자기 절(pipeline 또는 mcp)만 읽는다. 비밀 칸은 출력·로그·오류 메시지에 나오지 않는다.
# 주석: 설명 · env=옛 환경변수 이름(덮기 파일 overrides·migrate가 씀 — S7e2부터 env로 준 값은 읽지 않음) · 형식 · 기본값 · [엔진 지문]/[인계 지문] =
#       그 칸을 읽는 파일이 지문에 들어가 env로도 계속 내준다(영구 다리) · [호스트] = compose·systemd·셸이 `python -m common.config.export`로 꺼내 씀.
# 덮기 파일(S7e2): 최상위 base(원본 설정 파일 경로)·overrides({옛 env 이름: 글자})만 든 yaml — 한 번 실행에 몇 칸만 바꿀 때(python -m common.config.overrides).
# 분류표: docs/refactoring/refactor_plan.md 부록 D
# [서버 옛 값: …] = 옛 옵션 카탈로그(options.conf — S7e2에 지움)·옛 서버 compose environment 기본값이 서버 컨테이너에 주던 값 — 코드 기본값과 결과가
#       다른 칸(C-39·C-45, 사용자 10-27·10-28). 서버(·PC) 설정 파일로 옮길 때 지금 동작을 지키려면 이 값을 적는다(run_mode: prod는 모든 환경 — C-43 · 빠뜨리면 PG 연결 실패 때 문서 대장·정형 저장소가 SQLite로 조용히 대체됨 — C-54).
#       ''는 빈 글자로 적어야 결과가 같은 칸(빈 글자 유지 칸·이미지 기본값이 있는 칸 — VS7e1 R-4). 옮긴 뒤 `python -m common.config.migrate --compare`로 확인.


common:
  run_env:  # 실행 환경 — local(PC·valid_env 기준)·dev·stage·prd(서버, 외부 모델 거부). env RUN_ENV가 이 값을 이김 · env=RUN_ENV · local|dev|stage|prd
  connections:
    edw:
      conn_file:  # EDW 접속 정보를 KEY=VALUE로 담은 파일 경로(환경변수가 이 값을 덮음) · env=EDW_CONN_FILE · str
      database:  # EDW(SQL Server) 연결 DB 이름 · env=EDW_DATABASE · str
      driver:  # EDW 드라이버 선택(pymssql 기본, pyodbc 가능) · env=EDW_DRIVER · str · 기본 pymssql
      encrypt:  # pyodbc 연결 Encrypt 옵션(yes|no) · env=EDW_ENCRYPT · str · 기본 yes
      odbc_driver:  # pyodbc가 쓸 ODBC 드라이버 이름 · env=EDW_ODBC_DRIVER · str · 기본 ODBC Driver 18 for SQL Server
      password:  # EDW 접속 비밀번호 · env=EDW_PASSWORD · SecretStr [비밀]
      port:  # EDW 포트 · env=EDW_PORT · int(포트 — 정수만) · 기본 1433
      db_schema:  # EDW 표 스키마 이름(영문·숫자·_) · env=EDW_SCHEMA · str · 기본 AI
      server:  # EDW 서버 주소(호스트) · env=EDW_SERVER · str
      trust_cert:  # pyodbc 연결 TrustServerCertificate 옵션(yes|no) · env=EDW_TRUST_CERT · str · 기본 yes
      user:  # EDW 접속 계정 · env=EDW_USER · str
    object_storage:
      access_key:  # Object Storage(S3) 액세스 키 · env=OS_ACCESS_KEY · SecretStr [비밀]
      endpoint:  # Object Storage(S3 호환) 엔드포인트 URL — 비면 boto3 기본 · env=OS_ENDPOINT · str
      region:  # Object Storage 리전 이름 · env=OS_REGION · str · 기본 us-east-1
      secret_key:  # Object Storage(S3) 시크릿 키 · env=OS_SECRET_KEY · SecretStr [비밀]
      verify_tls:  # TLS 인증서 검증(1=검증, 0=끔, 그 밖 문자열=CA 파일 경로) · env=OS_VERIFY_TLS · str · 기본 1 [빈 글자 유지]
    openviking:
      features:  # OpenViking 연동 기능 목록(summary·search·parse, 콤마) — 비면 전부 꺼짐 · env=OV_FEATURES · 목록(쉼표 또는 YAML 목록) · 기본 (빈 목록)
      host:  # OV_URL이 없고 docker 탐지 불가일 때 포트(1933) 탐지할 호스트 · env=OV_HOST · str · 기본 127.0.0.1
      url:  # OpenViking 서버 주소 — 비면 Docker·포트(1933) 자동 탐지 · env=OV_URL · str
    parsing_meta:
      connect_kwargs:  # parsing-meta EDW pymssql 연결에 더할 추가 인자(JSON 객체) · env=PM_DB_CONNECT_KWARGS · SecretStr [비밀]
      database:  # parsing-meta EDW 연결 DB 이름 · env=PM_DB_DATABASE · str
      host:  # parsing-meta EDW 서버 주소(호스트) · env=PM_DB_HOST · str
      password:  # parsing-meta EDW 쓰기 계정 비밀번호 · env=PM_DB_PASSWORD · SecretStr [비밀]
      port:  # parsing-meta EDW 포트 · env=PM_DB_PORT · int(포트 — 정수만) · 기본 1433
      sqlite:  # 시험용 가짜 EDW(SQLite) 파일 경로 — 있으면 실제 EDW 대신 씀 · env=PM_DB_SQLITE · str
      table:  # parsing-meta를 쓸 EDW 표 이름(스키마.표, 영문·숫자·_) · env=PM_TABLE · str · 기본 AI.ParsingMeta [빈 글자 유지]
      user:  # parsing-meta EDW 쓰기 계정 이름 · env=PM_DB_USER · str
    pg:
      conn_file:  # PostgreSQL 접속 정보를 KEY=VALUE로 담은 파일 경로(환경변수가 덮음) · env=PG_CONN_FILE · str
      connect_timeout:  # PostgreSQL 연결 시도 제한 시간 · env=PG_CONNECT_TIMEOUT · int · 기본 10
      db:  # PostgreSQL 데이터베이스 이름 · env=PG_DB · str · 기본 rag
      host:  # PostgreSQL 서버 주소 — PG_HOST·PG_PORT·PG_CONN_FILE이 모두 비면 docker ps로 pgvector를 자동 탐지, 그래도 없으면 127.0.0.1(common/store/pg.py) · env=PG_HOST · str
      password:  # PostgreSQL 비밀번호 · env=PG_PASSWORD · SecretStr [비밀]
      pool_max:  # 검색 MCP PostgreSQL 연결 풀 최대 연결 수 · env=PG_POOL_MAX · int · 기본 8
      port:  # PostgreSQL 포트 — 비면 자동 탐지(PG_HOST 설명), 그래도 없으면 5432 · env=PG_PORT · int(포트 — 정수만)
      db_schema:  # pgvector 기본 스키마 이름(소문자·숫자·_) · env=PG_SCHEMA · str
      standin_dir:  # PG 접속 정보가 없을 때 쓰는 로컬 대체 DB(sqlite) 폴더 · env=PG_STANDIN_DIR · str
      user:  # PostgreSQL 접속 계정 이름 · env=PG_USER · str · 기본 rag
  dev:
    exp_store:  # PC 평가(stack_matrix) 결과 저장소 폴더 · env=EXP_STORE · str
    llm_est_in_tokens:  # stack_matrix 비용 추정에서 질문당 입력 토큰 가정 · env=LLM_EST_IN_TOKENS · int · 기본 1500
    llm_est_out_tokens:  # stack_matrix 비용 추정에서 질문당 출력 토큰 가정 · env=LLM_EST_OUT_TOKENS · int [서버 옛 값: 1200]
    llm_fake:  # 1이면 LLM 호출을 네트워크·캐시 없는 모의 응답으로 대체(시험·비용 추정용) · env=LLM_FAKE · bool · 기본 false [켬: 1만]
    min_gold_coverage:  # stack_matrix에서 정답 문서 포함률이 이 값 이상이어야 valid · env=MIN_GOLD_COVERAGE · float · 기본 0.95
    docker:
      mcp_publish_port:  # 시험 compose에서 MCP를 호스트에 게시할 포트 · env=MCP_PUBLISH_PORT · int(포트 — 정수만) · 기본 18765
      minio_image:  # 시험용 minio 이미지 · env=MINIO_IMAGE · str · 기본 bitnamilegacy/minio:latest
      minio_publish_port:  # 시험 minio를 호스트에 게시할 포트 · env=MINIO_PUBLISH_PORT · int(포트 — 정수만) · 기본 19000
      pg_bind:  # 시험 PostgreSQL 컨테이너를 호스트에 게시할 바인드 주소 · env=PG_BIND · str · 기본 127.0.0.1
      pg_effective_cache:  # 시험 PG effective_cache_size · env=PG_EFFECTIVE_CACHE · str · 기본 12GB
      pg_image:  # 시험 PostgreSQL(pgvector) 이미지 · env=PG_IMAGE · str · 기본 pgvector/pgvector:pg16
      pg_maint_mem:  # 시험 PG maintenance_work_mem(HNSW 생성) · env=PG_MAINT_MEM · str · 기본 2GB
      pg_max_conn:  # 시험 PG max_connections · env=PG_MAX_CONN · int · 기본 50
      pg_mem_limit:  # 시험 PG 컨테이너 메모리 상한 · env=PG_MEM_LIMIT · str
      pg_parallel:  # 시험 PG 병렬 작업자 수(maintenance·gather 둘 다) · env=PG_PARALLEL · int · 기본 2
      pg_shared_buffers:  # 시험 PG shared_buffers · env=PG_SHARED_BUFFERS · str · 기본 4GB
      pg_shm:  # 시험 PG 컨테이너 공유 메모리(shm_size) · env=PG_SHM · str · 기본 3g
      pg_work_mem:  # 시험 PG work_mem · env=PG_WORK_MEM · str · 기본 64MB
      postgres_db:  # PG 컨테이너 안에서 healthcheck가 쓰는 DB 이름(compose가 PG_DB로 채움) · env=POSTGRES_DB · str · 기본 rag
      postgres_user:  # PG 컨테이너 안에서 healthcheck가 쓰는 계정(compose가 PG_USER로 채움) · env=POSTGRES_USER · str · 기본 rag
      smoke_settings:  # 스모크 시험 컨테이너가 붙여 읽는 설정 파일(settings.yaml) 경로 — MCP 토큰·임베딩·Object Storage 키 등(S7e1 — 옛 SMOKE_ENV env 파일) · env=SMOKE_SETTINGS · str
      smoke_keep:  # 1이면 시험 끝나도 pg·minio 컨테이너를 남김 · env=SMOKE_KEEP · bool · 기본 false
      smoke_limit:  # 시험에서 파싱할 문서 수 상한(0이면 제한 없음) · env=SMOKE_LIMIT · int · 기본 0
      smoke_mode:  # 시험 파싱 모드(prod|test — test는 형식별 표본) · env=SMOKE_MODE · str · 기본 prod
      smoke_nightly:  # 1이면 자정 배치 모양(parse·publish만, pg·구조화·적재·MCP 생략) · env=SMOKE_NIGHTLY · bool · 기본 false
      smoke_pg_password:  # 시험 PostgreSQL 비밀번호(compose.test.yml이 컨테이너 PG_PASSWORD로 넘김 — S7e1) · env=SMOKE_PG_PASSWORD · SecretStr [비밀]
      smoke_pm_bucket:  # 시험 결과 게시용 minio 버킷 이름 · env=SMOKE_PM_BUCKET · str · 기본 rag-publish
      smoke_source:  # 시험 원천 위치(/data/docs 또는 s3://버킷/접두) · env=SMOKE_SOURCE · str · 기본 /data/docs
  host:
    doc_src:  # 원본 문서 폴더(DOC_DIR의 옛 별칭) — compose에선 /data/docs로 마운트할 호스트 폴더 · env=DOC_SRC · str [호스트]
    docker:  # 호스트 스크립트가 쓸 컨테이너 명령(docker|podman 등) · env=DOCKER · str · 기본 docker [호스트]
    image_stage_dir:  # prune_old.sh가 정리할 이미지 조각·tar 폴더(--stage-dir 기본값) · env=IMAGE_STAGE_DIR · str [호스트]
    output_root:  # 호스트의 결과(output) 폴더(서버 경로) — compose가 컨테이너 /app/output으로 마운트하는 원본(T-21 — 코드가 읽는 칸은 common.paths.output_root) · env=RAG_OUT · str [호스트]
    patch_code:  # 덧씌우기 코드 폴더(호스트) — compose.patch*.yml이 컨테이너 /app/deploy/*로 마운트 · env=PATCH_CODE · str · 기본 /srv/rag/code/live [호스트]
    pg_container:  # 호스트에서 psql을 docker exec할 PostgreSQL(pgvector) 컨테이너 이름 — run_docs.py 문서 수 세기(S7e1 — 옛 코드 고정값) · env=PG_CONTAINER · str [호스트]
    prune_keep:  # prune_old.sh가 남길 이미지 판 수(지금 판 포함, --keep 기본값) · env=PRUNE_KEEP · int · 기본 2 [호스트]
  models:
    embed:
      allow_external:  # 임베딩 외부 주소 허용(=1이면 열림, RUN_ENV=local일 때만) · env=EMBED_ALLOW_EXTERNAL · bool · 기본 false [켬: 1만]
      api_key:  # 임베딩 엔드포인트 API 키(있을 때만 Authorization 헤더로 보냄) · env=EMBED_API_KEY · SecretStr [비밀]
      base_url:  # 임베딩 엔드포인트 주소(OpenAI 호환 …/v1) · env=EMBED_BASE_URL · str
      dim:  # ping_models 점검에서 기대하는 임베딩 차원 수 · env=EMBED_DIM · int · 기본 4096
      est_usd:  # 임베딩 호출 1건당 예상 비용($) — 예산 선차감용 · env=EMBED_EST_USD · float · 기본 0.001
      model:  # 임베딩 모델 이름(색인과 같아야 함 — 질의 임베딩·캐시 열쇠에도 씀) · env=EMBED_MODEL · str
      query_cache:  # 질의 임베딩 캐시 sqlite 경로(0이면 캐시 끔) · env=EMBED_QUERY_CACHE · str
      query_cache_max:  # 질의 임베딩 캐시 최대 행 수(넘으면 오래된 것부터 삭제, 0이면 무제한) · env=EMBED_QUERY_CACHE_MAX · int · 기본 20000
      query_prefix:  # 질의 임베딩 앞에 붙이는 지시 문구(예: 'Instruct: …/nQuery: ') · env=EMBED_QUERY_PREFIX · str
      timeout:  # 임베딩 API 호출 제한 시간(초) · env=EMBED_TIMEOUT · int · 기본 60
    guard:
      budget_usd:  # 유료(외부) 모델 호출 누적 비용 상한($) — 넘으면 호출 안 함, 비우면 상한 없음(nan·inf는 형식 오류) · env=LLM_BUDGET_USD · float
      external_max_docs:  # 외부 모델 사용 시(scope=func) 허용 문서 수 상한(개) · env=EXTERNAL_MAX_DOCS · int · 기본 10
      external_max_questions:  # 외부 모델 사용 시(scope=func) 허용 질문 수 상한(개) · env=EXTERNAL_MAX_QUESTIONS · int · 기본 20
      external_scope:  # 외부 모델 사용 범위 — 'e2e'가 아니면 전부 func(기능 시험, 문서·질문 수 상한 적용) · env=EXTERNAL_SCOPE · str · 기본 func [빈 글자 유지]
      internal_host_suffixes:  # 내부망으로 인정할 호스트 이름 접미사 목록(쉼표 구분, 실제 주소가 사설일 때만) · env=INTERNAL_HOST_SUFFIXES · 목록(쉼표 또는 YAML 목록) · 기본 (빈 목록)
      internal_ip_ranges:  # 사설(RFC1918) 밖의 사내 IP 대역 CIDR 목록(쉼표 구분) · env=INTERNAL_IP_RANGES · 목록(쉼표 또는 YAML 목록) · 기본 (빈 목록)
      max_calls:  # LLM 호출 수 상한(개) — 0이면 무제한 · env=LLM_MAX_CALLS · int · 기본 0
      no_paid_calls:  # =1이면 외부(유료) 주소 호출 자체를 거부 · env=NO_PAID_CALLS · bool · 기본 false [켬: 1만]
      spend_file:  # 지출 장부 파일 경로(호출마다 금액 한 줄 — 프로세스·실행 전체가 공유) · env=LLM_SPEND_FILE · str
    llm:
      allow_external:  # LLM 외부 주소 허용(=1, RUN_ENV=local일 때만) · env=LLM_ALLOW_EXTERNAL · bool · 기본 false [켬: 1만]
      api_key:  # LLM 엔드포인트 API 키(있을 때만 사용) · env=LLM_API_KEY · SecretStr [비밀]
      base_url:  # LLM 엔드포인트 주소(OpenAI 호환 …/v1) · env=LLM_BASE_URL · str
      cache_dir:  # LLM 응답 캐시 폴더(요청 해시별 json) · env=LLM_CACHE_DIR · str
      empty_retry:  # 빈 응답(생각이 토큰 소진) 안전망 — =0이면 끔, 그 밖이면 max_tokens×4로 1회 재요청 · env=LLM_EMPTY_RETRY · bool · 기본 true [끔: 0만]
      empty_retry_max:  # 빈 응답 재요청 때 max_tokens 상한(토큰) · env=LLM_EMPTY_RETRY_MAX · int · 기본 8000
      est_usd:  # LLM 한 턴(run_agent)당 예상 비용($) — 예산 선차감용 · env=LLM_EST_USD · float · 기본 0.01
      extra_body:  # LLM 요청 본문에 합칠 JSON 객체(예: 생각 끄기 {'reasoning':{'enabled':false}}) · env=LLM_EXTRA_BODY · JSON(사전·목록)
      max_concurrency:  # LLM 동시 요청 총량(실험 도구 answer의 workers×inner_workers 상한) · env=LLM_MAX_CONCURRENCY · float · 기본 8 [auto = 비움]
      model:  # LLM 모델 이름 · env=LLM_MODEL · str
      price_in:  # LLM 입력 단가($/백만 토큰) — 내장 가격표보다 우선 · env=LLM_PRICE_IN · float
      price_out:  # LLM 출력 단가($/백만 토큰) — 내장 가격표보다 우선 · env=LLM_PRICE_OUT · float
      rpm:  # LLM 분당 호출 상한(건) — 0이면 무제한 · env=LLM_RPM · int · 기본 0
      timeout:  # LLM 호출 제한 시간(초) — 호출자가 timeout을 주면 그 값이 우선 · env=LLM_TIMEOUT · float · 기본 120.0
    ocrvlm:
      allow_external:  # OCR 전용 VLM 외부 주소 허용(=1, RUN_ENV=local일 때만) · env=OCRVLM_ALLOW_EXTERNAL · bool · 기본 false [켬: 1만]
      api_key:  # OCR 전용 VLM 엔드포인트 API 키(있을 때만) · env=OCRVLM_API_KEY · SecretStr [비밀]
      base_url:  # OCR 전용 VLM 엔드포인트 주소(OpenAI 호환 …/v1) · env=OCRVLM_BASE_URL · str
      est_usd:  # OCR 전용 VLM 호출 1건당 예상 비용($) — 예산 선차감용 · env=OCRVLM_EST_USD · float · 기본 0.01
      model:  # OCR 전용 VLM 모델 이름(0.9B급 GLM-OCR·PaddleOCR-VL 등) · env=OCRVLM_MODEL · str [엔진 지문]
    rerank:
      allow_external:  # 재순위 외부 주소 허용(=1, RUN_ENV=local일 때만) · env=RERANK_ALLOW_EXTERNAL · bool · 기본 false [켬: 1만]
      api_key:  # 재순위(rerank) 엔드포인트 API 키(있을 때만) · env=RERANK_API_KEY · SecretStr [비밀]
      base_url:  # 재순위 엔드포인트 주소(TEI/Cohere 호환 /rerank) · env=RERANK_BASE_URL · str
      est_usd:  # 재순위 호출 1건당 예상 비용($) — 예산 선차감용 · env=RERANK_EST_USD · float · 기본 0.001
      model:  # 재순위 모델 이름 · env=RERANK_MODEL · str
    transport:
      connect_timeout:  # 모델 서버 연결(connect) 전용 제한 시간(초) — 0 이하면 끔 · env=MODEL_CONNECT_TIMEOUT · float · 기본 10.0
      down_after:  # 연속 연결 실패 몇 번이면 그 주소를 '다운'으로 보는가(회) · env=MODEL_DOWN_AFTER · int · 기본 3
      down_cooldown:  # '다운' 판정 뒤 네트워크를 보내지 않고 즉시 거부하는 시간(초) · env=MODEL_DOWN_COOLDOWN · float · 기본 300.0
      ping_timeout:  # ping_models 점검의 호출 제한 시간(초) · env=PING_TIMEOUT · int · 기본 60
      transport:  # 모델 호출 전송 방식 — adk(기본) 또는 http(urllib 롤백 경로) · env=MODEL_TRANSPORT · str · 기본 adk
    vlm:
      allow_external:  # VLM 외부 주소 허용(=1, RUN_ENV=local일 때만) · env=VLM_ALLOW_EXTERNAL · bool · 기본 false [켬: 1만]
      api_key:  # VLM 엔드포인트 API 키(있을 때만) · env=VLM_API_KEY · SecretStr [엔진 지문] [비밀]
      base_url:  # VLM 엔드포인트 주소(OpenAI 호환 …/v1) · env=VLM_BASE_URL · str [엔진 지문]
      concurrency:  # 한 문서의 쪽(그림) VLM 동시 요청 수(개) · env=VLM_CONCURRENCY · int · 기본 4 [엔진 지문]
      est_usd:  # VLM 호출 1건당 예상 비용($) — 예산 선차감용 · env=VLM_EST_USD · float · 기본 0.02
      extra_body:  # VLM(·OCRVLM) 요청 본문에 합칠 JSON 객체(예: chat_template_kwargs로 생각 끄기) · env=VLM_EXTRA_BODY · JSON(사전·목록)
      max_concurrency:  # 공유 VLM 서버 동시 요청 총량 상한(문서 동시 수 × 쪽 동시 수가 이 값을 못 넘게 줄임) · env=VLM_MAX_CONCURRENCY · float · 기본 8 [auto = 비움]
      model:  # VLM 모델 이름 · env=VLM_MODEL · str [엔진 지문]
      model_alt:  # 그림 검토 판정용 VLM 모델 이름(없으면 VLM_MODEL과 같음) · env=VLM_MODEL_ALT · str
      retry:  # VLM 쪽 호출 시간 초과·연결 오류 때 재시도 횟수(회) · env=VLM_RETRY · int · 기본 1 [엔진 지문]
      timeout:  # VLM 쪽당 호출 제한 시간(초) · env=VLM_TIMEOUT · int · 기본 180 [엔진 지문]
  paths:
    client_roster:  # 고객 명부 파일 경로(JSON {이름:[별칭]} 또는 CSV) — 용어·별칭에 합침 · env=CLIENT_ROSTER · str [인계 지문]
    config_dir:  # 서버 설정 폴더(코드 폴더 밖) — 호스트 스크립트가 settings.yaml을 여기서 찾음(원천 목록 sources.json 덮어쓰기는 S8b에 없앰 — 서버는 판 표) · env=SERVER_ENV_DIR · str
    criteria_file:  # 판정 문턱값 파일 경로(criteria.json) · env=CRITERIA_FILE · str
    doc_dir:  # 원본 문서 폴더 — 원본 위치 주소·파싱 입력의 기준(pipeline 이미지 안 기본 /data/docs — 옛 Dockerfile ENV, B-2) · env=DOC_DIR · str [인계 지문]
    doc_dir_prepared:  # 준비(dedup·회전) 끝난 문서 폴더 — 파싱의 --src 기본값(pipeline 이미지 안 기본 /app/output/prepared — 옛 Dockerfile ENV, B-2) · env=DOC_DIR_PREPARED · str
    draft_terms_out:  # 용어 자동 초안 CSV 경로 · env=DRAFT_TERMS_OUT · str [인계 지문]
    eval_sets_dir:  # 평가 세트(합성 E2E·정답률 측정) 저장소 폴더 · env=EVAL_SETS_DIR · str
    glossary_dir:  # 용어 사전 폴더(domain_terms.csv·id_patterns.csv 등) · env=GLOSSARY_DIR · str [인계 지문]
    index_root:  # 이름 있는 색인 폴더 루트(<index_id>/bundle) · env=INDEX_ROOT · str
    korean_font:  # 한글 글꼴 파일 경로(그림 렌더·점검용) · env=KOREAN_FONT · str
    mcp_bundle:  # 검색할 로컬 묶음(bundle) 폴더 경로 — 검색 MCP 로컬 저장소·평가(server_checks)가 읽음(S7e1 — 두 앱이 읽어 common, 옛 mcp.server.bundle) · env=MCP_BUNDLE · str
    output_root:  # 결과(output) 폴더 — 코드가 이 아래를 읽고 씀(컨테이너 안 경로 — 서버는 /app/output, 비우면 코드 기본. 마운트 원본은 common.host.output_root — T-21) · env=RAG_OUT · str
    runlog_dir:  # 실행 기록(output/logs) 루트 폴더 · env=RUNLOG_DIR · str
    source_manifest:  # 원본 manifest.jsonl 경로(Object Storage/rdb에서 받은 문서 → s3:// 주소 대응) · env=SOURCE_MANIFEST · str [인계 지문]
    sources_file:  # PC(RUN_ENV=local) 원천 목록 파일 경로(비우면 resources/mappings/sources.json) — 서버는 판 표 struct.source_version 활성 판(S8b) · env=SOURCES_FILE · str
    stack_file:  # PC(RUN_ENV=local) 엔진 구성 파일 경로(비우면 resources/config/pipeline_stack.json) — 서버는 판 표 struct.stack_version 활성 판(S8b) · env=PIPELINE_STACK_FILE · str
  runtime:
    cpu_max_load:  # 새 하위 프로세스를 띄우는 CPU 부하 상한(1분 부하 평균 ÷ 코어 수) · env=CPU_MAX_LOAD · float · 기본 0.9 [auto = 비움]
    draft_terms_lock_timeout:  # 용어 초안 CSV 쓰기 잠금 대기 시간(초) — 못 얻으면 이번엔 포기 · env=DRAFT_TERMS_LOCK_TIMEOUT · float · 기본 5.0 [인계 지문]
    exp_max_workers:  # 실험 도구(stack_matrix) 병렬 작업 수 상한(개) · env=EXP_MAX_WORKERS · float · 기본 8 [auto = 비움]
    exp_proc_gb_answer:  # 실험 answer 작업 1개당 메모리 가정(GB)(S7b — resources.plan_experiment가 cmd로 이름을 지어 읽음) · env=EXP_PROC_GB_ANSWER · float · 기본 0.5 [auto = 비움]
    exp_proc_gb_build:  # 실험 build 작업 1개당 메모리 가정(GB) · env=EXP_PROC_GB_BUILD · float · 기본 1.5 [auto = 비움]
    exp_proc_gb_run:  # 실험 run(·answer) 작업 1개당 메모리 가정(GB) · env=EXP_PROC_GB_RUN · float · 기본 0.5 [auto = 비움]
    exp_reserve_gb:  # 실험 병렬 수를 정할 때 남겨 둘 메모리(GB) · env=EXP_RESERVE_GB · float · 기본 4.0 [auto = 비움]
    lib_env:  # 라이브러리 env(이름: 글자 — TZ·OMP_NUM_THREADS·HF_HUB_OFFLINE 등 허용 목록만, 비밀 아님) — 컨테이너 시작 때 entrypoint가 env로 냄(사용자 env는 안 덮고 이미지 ENV는 덮음 — C-45 ⑤, S7e2) · env=LIB_ENV · 사전(라이브러리 env 이름: 글자) · 기본 {}
    log_retention_days:  # output/logs/*.log 보존 일수 — 지난 로그 삭제, 0 이하면 삭제 안 함 · env=LOG_RETENTION_DAYS · int · 기본 30
    mem_max_pct:  # 생산 파싱이 새 프로세스를 띄우는 메모리 사용률 상한(%) · env=MEM_MAX_PCT · float · 기본 90.0 [auto = 비움]
    mem_settle_margin:  # 상한(MEM_MAX_PCT) 이만큼(%p) 아래부터 프로세스 띄운 뒤 잠깐 쉼 · env=MEM_SETTLE_MARGIN · float · 기본 5.0 [auto = 비움]
    mem_settle_sec:  # 메모리가 상한 근처일 때 프로세스 띄운 뒤 쉬는 시간(초) · env=MEM_SETTLE_SEC · float · 기본 2.0 [auto = 비움]
    mem_start_pct:  # wait_mem 기본 상한 — 실험 도구가 새 프로세스를 띄우는 메모리 사용률(%) · env=MEM_START_PCT · float · 기본 90.0 [auto = 비움]
    pipe_max_procs:  # 파싱 엔진 프로세스 수 자동 결정의 상한(개) · env=PIPE_MAX_PROCS · float · 기본 8 [auto = 비움]
    pipe_proc_gb:  # 엔진 프로세스 1개당 메모리 가정(GB) — 자동 프로세스 수 계산용 · env=PIPE_PROC_GB · float · 기본 3.0 [auto = 비움]
    pipe_procs:  # CPU 엔진 프로세스 수 — 비우거나 auto면 CPU·메모리로 계산(소수는 버림) · auto는 글자로 기억(run_all --procs 기본: auto → auto, 비움 → 1 — S7c1) · auto는 대소문자·앞뒤 공백 무시 · pipeline 이미지 안 기본 auto(옛 Dockerfile ENV, B-2) · env=PIPE_PROCS · float | auto
    pipe_reserve_cpus:  # 자동 프로세스 수 계산 때 남겨 둘 CPU 코어 수(개) · env=PIPE_RESERVE_CPUS · float · 기본 1 [auto = 비움]
    pipe_reserve_gb:  # 자동 프로세스 수 계산 때 남겨 둘 메모리(GB) · env=PIPE_RESERVE_GB · float · 기본 4.0 [auto = 비움]
    pipe_threads:  # 프로세스 1개당 수치 라이브러리 스레드 수(OMP·MKL·onnx) — 비우거나 auto면 CPU ÷ 프로세스 수(소수는 버림) · env=PIPE_THREADS · float [auto = 비움]
    pipe_workers:  # VLM API 동시 처리 문서 수(개) — GPU 서버 한도 기준 · env=PIPE_WORKERS · float · 기본 4 [auto = 비움]
  store:
    doc_registry:  # 문서 대장(doc_registry) 사용 — =0이면 끄고 필터 없이 동작 · env=DOC_REGISTRY · bool · 기본 true [끔: ''·0·none·false]
