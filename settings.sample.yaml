    gold_draft_mermaid_check:  # 정답 초안의 Mermaid 블록 2차 점검을 켤지(0/false/no면 끔) · env=GOLD_DRAFT_MERMAID_CHECK · bool · 기본 true [끔: 0·false·no]
    phase_report_legacy:  # 옛 PHASE_REPORT.md·phase 보고서 자동 생성을 되살릴지(=1 생성 / 0 끔) · env=PHASE_REPORT_LEGACY · bool · 기본 false [켬: 1만]
    qa_draft_max_pages:  # 질문 초안 생성(qa_draft)에서 문서당 처리할 쪽 수 상한(쪽) · env=QA_DRAFT_MAX_PAGES · int · 기본 20
    qa_draft_per_page:  # 질문 초안 생성에서 쪽당 질문 수 상한(개) · env=QA_DRAFT_PER_PAGE · int · 기본 5
    review_max_rounds:  # 도식 검토 루프의 최대 재추출 횟수(회) · env=REVIEW_MAX_ROUNDS · int · 기본 2
    score_table_judge:  # 표 구조 채점의 경계 표 판정자(0 없음 | llm 경계 표만 LLM 판정) · env=SCORE_TABLE_JUDGE · str · 기본 0
  extract:
    auto_reparse_changed:  # 야간 계획에서 바뀐 문서(changed) 전체를 다시 파싱할지(=1 재파싱) · env=AUTO_REPARSE_CHANGED · bool · 기본 false [켬: 1만]
