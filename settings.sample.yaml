    struct_backend:  # 정형 저장소 종류 pg|sqlite|tsql · env=STRUCT_BACKEND · str · 기본 pg [빈 글자 유지]
    struct_db:  # 정형 저장소 SQLite 파일 경로(STRUCT_BACKEND=sqlite일 때·PG 대체 시) · env=STRUCT_DB · str
  text:
    draft_terms_max:  # 용어 자동 초안 파일 행 수 상한(개) — 넘으면 가장 빈번한 것만 유지 · env=DRAFT_TERMS_MAX · int · 기본 500 [인계 지문]
    parse_token_norm:  # 파싱 결과 비교의 숫자 표기 정규화(AD25) — =0이면 끄고 이전 동작 · env=PARSE_TOKEN_NORM · bool · 기본 true [끔: ''·0·none·false]
    search_recency:  # 같은 문서군의 최신 판 우선 모드 — 0 끔·1 최신을 묻는 질문에서만·2 항상(common/core/docmeta.py — S7b에 mcp.search에서 옮김) · env=SEARCH_RECENCY · str · 기본 1 [빈 글자 유지]
    search_en_stem:  # 검색 토큰의 영어 복수→단수 정규화(G16, 가산만) — =0이면 끔 · env=SEARCH_EN_STEM · bool · 기본 true [인계 지문] [끔: 0만]
    source_uri_prefix:  # 원본 위치 주소의 접두어(예: s3://버킷/접두 · file:///srv/rag/docs) · env=SOURCE_URI_PREFIX · str [인계 지문]
    token_num_norm:  # 검색 토큰의 숫자·단위 정규화(T1) — =0이면 끄고 이전 동작 · env=TOKEN_NUM_NORM · bool · 기본 true [인계 지문] [끔: ''·0·none·false]

