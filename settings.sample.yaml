    test_min_docs:  # 시험 모드(--mode test)에서 표본 추출을 시작하는 최소 문서 수(개) · env=TEST_MIN_DOCS · int · 기본 50
    test_per_type:  # 시험 모드 표본에서 확장자별로 고르는 문서 수(개) · env=TEST_PER_TYPE · int · 기본 5
