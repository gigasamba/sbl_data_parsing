      user:  # OpenViking 요청 헤더 X-OpenViking-User 값(사용자) · env=OV_USER · str · 기본 default [빈 글자 유지]
    rdb:
      bucket:  # RDB 표에 버킷 정보가 없을 때 쓸 Object Storage 버킷 이름(레거시 대체값) · env=RDB_BUCKET · str
      company:  # RDB에서 가져올 회사 ID 필터(쉼표 목록, 비우면 필터 없음) · env=RDB_COMPANY · 목록(쉼표 또는 YAML 목록) · 기본 (빈 목록)
      connect_kwargs:  # RDB(mssql) 접속 시 pymssql.connect에 추가로 넘길 인자(JSON 객체) · env=RDB_CONNECT_KWARGS · SecretStr [비밀]
      database:  # RDB(mssql) 데이터베이스 이름 · env=RDB_DATABASE · str
      doc_type:  # RDB에서 가져올 문서 유형 필터(쉼표 목록, 비우면 필터 없음) · env=RDB_DOC_TYPE · 목록(쉼표 또는 YAML 목록) · 기본 (빈 목록)
      engine:  # RDB 종류(mssql | pg) · env=RDB_ENGINE · str · 기본 mssql [빈 글자 유지]
      host:  # RDB(mssql) 서버 주소 · env=RDB_HOST · str
      increment_col:  # 증분(since) 판정에 쓸 열 이름(updated 열이 없을 때 대체) · env=RDB_INCREMENT_COL · str
      password:  # RDB(mssql) 접속 비밀번호 · env=RDB_PASSWORD · SecretStr [비밀]
      port:  # RDB(mssql) 서버 포트 · env=RDB_PORT · int(포트 — 정수만) · 기본 1433
      user:  # RDB(mssql) 접속 사용자 이름 · env=RDB_USER · str
      columns:
        bucket:  # RDB 문서 위치 표에서 버킷 열의 이름(비우면 열 없음) · env=RDB_COL_BUCKET · str
        company:  # RDB 문서 위치 표에서 회사 ID(필터용) 열의 이름(비우면 열 없음) · env=RDB_COL_COMPANY · str
        content_type:  # RDB 문서 위치 표에서 콘텐츠 타입 열의 이름(비우면 열 없음) · env=RDB_COL_CONTENT_TYPE · str
        content_version:  # RDB 문서 위치 표에서 문서 판(content version) ID 열의 이름 · env=RDB_COL_CONTENT_VERSION · str · 기본 content_version_id [빈 글자 유지]
        contract:  # RDB 문서 위치 표에서 계약 ID 열의 이름(비우면 열 없음) · env=RDB_COL_CONTRACT · str
        doc_id:  # RDB 문서 위치 표에서 문서 ID 열의 이름 · env=RDB_COL_DOC_ID · str · 기본 id [빈 글자 유지]
        doc_type:  # RDB 문서 위치 표에서 문서 유형(필터용) 열의 이름(비우면 열 없음) · env=RDB_COL_DOC_TYPE · str
        etag:  # RDB 문서 위치 표에서 ETag 열의 이름(비우면 열 없음) · env=RDB_COL_ETAG · str
        filename:  # RDB 문서 위치 표에서 원본 파일 이름 열의 이름 · env=RDB_COL_FILENAME · str · 기본 original_filename [빈 글자 유지]
        is_deleted:  # RDB 문서 위치 표에서 삭제 표시 열의 이름(비우면 열 없음) · env=RDB_COL_IS_DELETED · str
        key:  # RDB 문서 위치 표에서 Object Storage 키(s3_key) 열의 이름 · env=RDB_COL_KEY · str · 기본 s3_key [빈 글자 유지]
        size:  # RDB 문서 위치 표에서 파일 크기 열의 이름 · env=RDB_COL_SIZE · str · 기본 file_size [빈 글자 유지]
        supersedes:  # RDB 문서 위치 표에서 대체 대상 문서 ID 열의 이름(비우면 열 없음) · env=RDB_COL_SUPERSEDES · str
        updated:  # RDB 문서 위치 표에서 갱신 시각(증분 기준) 열의 이름(비우면 열 없음) · env=RDB_COL_UPDATED · str
        version:  # RDB 문서 위치 표에서 문서 버전 열의 이름(비우면 열 없음) · env=RDB_COL_VERSION · str
    secure_doc:
      password:  # 암호 걸린 문서를 여는 암호 1개(secure_docs decrypt에서 시도) · env=SECURE_DOC_PASSWORD · SecretStr [비밀]
      passwords_file:  # 암호 걸린 문서용 암호 목록 파일 경로(한 줄에 암호 하나) · env=SECURE_DOC_PASSWORDS_FILE · str
  dev:
    allow_common_mismatch:  # 앞 모듈 결과의 공통 코드 지문이 달라도 계속 진행할지(=1 계속 / 그 외 중단) · env=ALLOW_COMMON_MISMATCH · bool · 기본 false [켬: 1만]
    check_env_any_py:  # check_env가 시스템 python에서도 멈추지 않고 계속할지(=1 계속 / 그 외 중단) · env=CHECK_ENV_ANY_PY · bool · 기본 false [켬: 1만]
    parallel_test_crash:  # 시험용 — =1이면 문서 병렬 파싱의 첫 문서에서 강제 종료(os._exit 17) · env=PARSE_PARALLEL_TEST_CRASH · bool · 기본 false [켬: 1만]
