# EDW 조인 사슬(pl-29) — 적재가 문서 메타(고객·원천 전용 칸·등록 시각)를 채울 때 따라가는 EDW 표·칸 이름.
# 운영 쪽이 고칠 수 있는 파일(사용자 11-02) — 읽는 곳: pipeline/load/edw_meta.py(적재 때 한 번 읽고 검사).
# 규칙:
# - 표는 `스키마.표`, 칸은 영문·숫자·_ 만(SQL에 그대로 들어가므로 검사 — 어긋나면 적재가 이유를 말하고 멈춤). 값은 늘 바인딩.
# - out: {gold doc 칸: EDW 칸} — gold 칸은 그 원천 전용 칸(doc_class 빼고)과 client_edw(SFDC는 코드가 계정에서 채움)만 — 문서 키·created_at은 안 됨. contract_date는 날짜로, created_at은 시각으로 읽음.
# - 실제 칸 이름은 DB 담당자 확인(refactor.md C-76 · docs/architecture/db_schema.md §1 원천별 사슬).

files: {table: AI.FileStorageMap, key: s3_key, created: created_at}   # 모든 원천 공통 — FAQ·Other는 등록 시각만

sfdc:
  version: {table: SFDC.ContentVersion, file_col: content_version_id, id: Id, doc: ContentDocumentId, created: CreatedDate}  # CreatedDate는 UTC
  link: {table: SFDC.ContentDocumentLink, doc: ContentDocumentId, entity: LinkedEntityId, deleted: IsDeleted}  # deleted = 0인 연결만
  opp_prefix: "006"       # 영업 기회 id 접두
  account_prefix: "001"   # 계정 id 접두 — 기회 후보가 아예 없을 때만: 아래 단계 표의 값 001 > 연결 개체 001
  steps:                  # 영업 기회를 찾는 순서 — 앞 단계에 후보가 있으면 거기서 정함(같은 단계 후보 둘 이상이면 비움)
    - {prefix: "006"}                                          # 연결 개체가 곧 영업 기회
    - {prefix: "00T", table: SFDC.Task, id: Id, value: WhatId}   # 할 일 → WhatId
    - {prefix: "00U", table: SFDC.Event, id: Id, value: WhatId}  # 일정 → WhatId
    # Quote 표가 EDW에 생기면 아래 줄을 켠다(지금 없음 — 사용자 11-02). optional: true면 표를 못 읽을 때 그 단계만 건너뜀.
    # - {prefix: "0Q0", table: SFDC.Quote, id: Id, value: OpportunityId, optional: true}
  opportunity:
    table: SFDC.Opportunity
    id: Id
    account: AccountId
    out: {sf_op_id: Id, sf_op_name: Name, project_code__c: Project_Code__c, service_type: Record_Type__c, contract_date: X1st_Contract_Execution_Date__c}
  account: {table: SFDC.Account, id: Id, name: Name}   # 고객 이름 → client_edw
  # 분류 힌트(pl-33 — gold 힌트 칸, 운영 analyze_clues 규칙). 개체 종류는 첫 User 아닌 연결의 id 접두(resources/mappings/sfdc_prefix.json).
  # 힌트 조회는 따로 묻는다 — 서버 EDW에 칸이 없으면 그 조회의 힌트만 비고 경고(적재 메타는 그대로).
  hints:
    title: Title           # version 표(ContentVersion)의 제목 칸 → title
    channel:               # 연결 개체가 이 종류면 그 표의 방향 → sent_received__c, 제목(120자) → subject
      - {type: Task, table: SFDC.Task, id: Id, direction: Sent_Received__c, subject: Subject}
      - {type: Event, table: SFDC.Event, id: Id, direction: Sent_Received__c, subject: Subject}
    # 연결 개체가 영업 기회 자체면(표·id는 opportunity) → stagename·real_rfp__c·rfp_received_start/end_date__c
    opportunity: {stage: StageName, real_rfp: Real_RFP__c, rfp_start: RFP_Received_Start_Date__c, rfp_end: RFP_Received_End_Date__c}

crms:
  map: {table: AI.FileStorageMap_CRMS, key: s3_key, contract: rm_contract_code, gate: gate_code, gate_version: gate_version, seq: docu_seq, out: {contract_id: rm_contract_code}}
  project: {table: CRMS.RM_CM_PJTLIST, contract: RM_CONTRACT_CODE, out: {client_edw: SF_ACC_NAME, division: DIVISION, prod_name: RM_CONTRACT_NAME, contract_date: INIT_DTTM}}
  docu: {table: CRMS.RM_CM_DOCU, contract: RM_CONTRACT_CODE, gate: GATE_CODE, gate_version: GATE_VERSION, seq: DOCU_SEQ, created: INIT_DTTM}  # 등록 시각(키 4개)

las:
  map: {table: AI.FileStorageMap_LAS, key: s3_key, manage_no: manage_no, signed: signed_date, file_id: las_file_id}
  file: {table: LAS.FileManager, id: FileID, created: CreateDate}   # 등록 시각
  # 최신 판(active 큰 것 → id 큰 것) — contract_id = 관리 번호(없으면 id), contract_date = date(없으면 map.signed), client_edw = client
  contract: {table: LAS.Contract, manage_no: ManageNo, active: IsActive, id: ContractID, date: ContractDate, client: PartnerCorpName}
  hints: {approval: ApprovalName}   # 분류 힌트(pl-33) — 최신 판 계약의 품의 제목 → approvalname(따로 조회)
