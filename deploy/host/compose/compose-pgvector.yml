# 검색 DB: PostgreSQL 16 + pgvector 하나 — 개발·운영 서버 모두 이 파일로 따로 한 번 띄운다(compose-<환경>.yml보다 먼저). 재시작 정책 always.
#   계정: 코드 폴더 맨 위 .env(git 제외 · 권한 600 · 사람이 적음)의 PG_USER·PG_DB·PG_PASSWORD — settings.yaml required.pg의 pg_user·pg_database·
#     pg_password와 같은 값(값에 $·따옴표·줄바꿈은 쓰지 않음 — 비어 있으면 compose가 멈춤). 환경 변수로 넘어가 docker inspect에 보인다.
#   띄우기(코드 폴더 맨 위에서): docker compose --env-file .env -f deploy/host/compose/compose-pgvector.yml up -d     내리기·로그: 같은 앞부분 + down·logs(데이터 폴더는 그대로 — --env-file .env 없이는 compose가 멈춤)
#   바꿀 자리: PG_DATA(데이터 폴더 — 기본 /data/pg/pipeline) — .env나 셸 env
#   접속: 서버 앱 컨테이너·서버 바깥 모두 <서버 IP>:5433(0.0.0.0에 연다 · PC 컨테이너는 host.docker.internal:5433).
name: sbl-pgvector
services:
  # 검색 DB(PostgreSQL 16 + pgvector) — 데이터 폴더 PG_DATA(기본 /data/pg/pipeline). 서버 바깥 5433 → 컨테이너 5432.
  #   계정·비밀번호는 데이터 폴더가 비었을 때(처음 한 번)만 쓰인다(그 뒤 바꾸려면 psql ALTER USER — .env·settings.yaml과 같은 값으로).
  #   메모리 값은 서버 메모리에 맞춰 고친다
  #   (대략 shared_buffers 1/8 · effective_cache_size 3/8 · maintenance_work_mem 1/16 · shm_size ≥ maintenance_work_mem + 1g).
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector                   # 서버에 따로 띄운 옛 pgvector 컨테이너는 먼저 내린다(이름·포트 5433이 겹침)
    restart: always
    ports: ["0.0.0.0:5433:5432"]
    environment:
      POSTGRES_DB: ${PG_DB:?.env에 PG_DB 필요}
      POSTGRES_USER: ${PG_USER:?.env에 PG_USER 필요}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?.env에 PG_PASSWORD 필요}
    volumes:
      - ${PG_DATA:-/data/pg/pipeline}:/var/lib/postgresql/data:z
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=64MB
               -c maintenance_work_mem=2GB -c max_parallel_maintenance_workers=2
               -c max_parallel_workers_per_gather=2 -c max_connections=100
    shm_size: 3g
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options: {max-size: "50m", max-file: "3"}
