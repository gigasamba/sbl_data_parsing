# 검색 DB. 띄우기(코드 폴더 맨 위): docker compose --env-file .env -f deploy/host/compose/compose-pgvector.yml up -d
# 계정은 데이터 폴더가 비었을 때 한 번만 쓰인다. 메모리 값은 서버에 맞춰 고친다.
name: sbl-pgvector
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    ports: ["0.0.0.0:5433:5432"]
    environment:
      POSTGRES_DB: ${PG_DB:?.env에 PG_DB 필요}
      POSTGRES_USER: ${PG_USER:?.env에 PG_USER 필요}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?.env에 PG_PASSWORD 필요}
    volumes:
      - ${PG_DATA:-/data/pg/pipeline}:/var/lib/postgresql/data:z
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=64MB
               -c maintenance_work_mem=2GB -c max_parallel_maintenance_workers=2
               -c max_parallel_workers_per_gather=2 -c max_connections=100
    shm_size: 3g
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options: {max-size: "50m", max-file: "3"}
