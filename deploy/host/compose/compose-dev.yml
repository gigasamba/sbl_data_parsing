# 개발 서버 — 개발자 벌 1~4의 SSH 작업 공간. 벌 N = ${SBL_ROOT}/data_pipeline-N/{app,home}
#   app → /app(코드·settings.yaml·output) · home → /root. 검색 MCP·parse_document는 compose-prd.yml(운영 묶음)로.
#   띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…]   (그 벌의 app 폴더에서)
name: docker-dev
x-dev: &dev
  restart: unless-stopped
  network_mode: host
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]
  pids_limit: 4096
  cpus: 2
  mem_limit: 8g
  memswap_limit: 8g
  logging:
    options: {max-size: "50m", max-file: "3"}

services:
  data-pipeline-1:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline-1
    command: ["devbox"]
    environment: {SSH_PORT: "8021", SETTINGS_FILE: /app/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-1/app:/app:z
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-1/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z

  data-pipeline-2:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline-2
    command: ["devbox"]
    environment: {SSH_PORT: "8022", SETTINGS_FILE: /app/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-2/app:/app:z
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-2/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z

  data-pipeline-3:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline-3
    command: ["devbox"]
    environment: {SSH_PORT: "8023", SETTINGS_FILE: /app/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-3/app:/app:z
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-3/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z

  data-pipeline-4:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline-4
    command: ["devbox"]
    environment: {SSH_PORT: "8024", SETTINGS_FILE: /app/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-4/app:/app:z
      - ${SBL_ROOT:-/home/sbl}/data_pipeline-4/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
