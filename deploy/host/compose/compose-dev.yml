# 개발 서버 묶음: 벌 0·1의 data-pipeline + 벌 0의 검색 MCP mcp-server·parse_document 작업 컨테이너 mcp-data-parsing을 한 파일로 띄운다.
#   PG(compose-pgvector.yml)·Redis(compose-redis.yml)는 따로 한 번 띄운다(host_ctl.sh secrets 먼저). 준비·접속 순서: docs/operations/server-guide.md §6-6
#   띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…](벌 폴더 settings.yaml required.env.run_env = dev면 이 파일)     내리기: … down
#   컨테이너는 모두 root로 뜬다. SSH 컨테이너(data-pipeline-*·mcp-server-0)는 root 비밀번호 SSH를 연다(비밀번호 = 이미지에 넣은 값).
#   실행 환경은 벌 settings.yaml required.env.run_env — dev·prd가 아니면 SSH 컨테이너가 시작을 거부한다.
#   이미지: 실행 이미지(*-runtime — 코드 없음) + 벌 폴더 전체를 /app/deploy에 쓰기 가능으로(코드·settings.yaml·edw_chain.yaml이 그 안).
#   바꿀 자리: SBL_ROOT(벌 폴더들의 위 폴더 — 기본 /home/sbl) · IMAGE_TAG(이미지 판) · DOC_SRC(원본 문서 폴더 — host_ctl.sh가 settings.yaml
#     required.deploy.host_docs_dir에서 냄) — 셸 env나 이 파일 옆 .env
#     컨테이너마다 ports(서버 포트:컨테이너 포트)·cpus·mem_limit·memswap_limit(메모리+스왑 합 — 같으면 스왑 안 씀)는 아래 각 칸에 직접 적는다
#     (컨테이너 하나의 cpus ≤ 서버 CPU 수 — docker가 거부). 벌을 늘리려면 data-pipeline-1 칸을 복사해 번호·포트·폴더를 바꾼다.
#   네트워크: docker 자체 네트워크(bridge) — 포트를 서버의 모든 주소(0.0.0.0)에 연다. 컨테이너 안 127.0.0.1은 컨테이너 자신이라
#     서버에 있는 PG(5433)·Redis(8010)·모델은 host.docker.internal로(settings.yaml required.pg.pg_host · common.connections.redis.redis_host).
#   검색 MCP: 벌 0 settings.yaml search.server — mcp_bind_host auto · mcp_port 8051 · required.tokens.mcp_token · mcp_allowed_hosts <서버 IP>:8051.
name: sbl-devset                             # compose 묶음 이름
x-dev: &dev
  restart: unless-stopped
  init: true
  user: "0"                                   # root — 벌 폴더에 쓰는 파일도 root 소유가 됨
  extra_hosts: ["host.docker.internal:host-gateway"]   # 컨테이너에서 서버 자신(PG·Redis·모델)
  pids_limit: 4096
  logging:
    options: {max-size: "50m", max-file: "3"}

services:
  data-pipeline-0:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-0
    command: ["devbox"]
    ports: ["0.0.0.0:8020:22"]                # SSH: 서버 8020 → 컨테이너 22
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0:/app/deploy:z                         # 벌 폴더 전체(코드 — 쓰기 가능)
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/settings.yaml:/app/deploy/settings.yaml:ro,z   # 설정은 읽기 전용
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output:/app/output:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/home:/root:z                          # root 홈 — SSH 호스트 열쇠·git 계정·작업 기록
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 16g

  data-pipeline-1:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-1
    command: ["devbox"]
    ports: ["0.0.0.0:8021:22"]
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1:/app/deploy:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/settings.yaml:/app/deploy/settings.yaml:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/output:/app/output:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g

  # 벌 0의 검색 MCP — 벌 0과 같은 코드·설정·결과(결과는 읽기 전용 — parse_document 작업 폴더만 쓰기), 홈만 따로(home/mcp).
  #   `devbox mcp` = sshd + MCP 서버(따로 지켜보지 않음 — mcp_keepalive.sh가 /health로 확인해 다시 시작).
  mcp-server-0:
    <<: *dev
    image: mcp-server-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-server-0
    command: ["devbox", "mcp"]
    ports: ["0.0.0.0:8050:22", "0.0.0.0:8051:8051"]   # SSH 8050 → 22 · HTTP 8051
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0:/app/deploy:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/settings.yaml:/app/deploy/settings.yaml:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output:/app/output:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output/_mcp_parse/jobs:/app/output/_mcp_parse/jobs:z   # parse_document 업로드·결과
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/home/mcp:/root:z
    cpus: 3
    mem_limit: 12g
    memswap_limit: 12g

  # 벌 0의 parse_document 작업 컨테이너 — Redis 소비자(pipeline.run_mcp_parsing)가 주 프로세스(죽으면 restart가 다시 띄움). SSH 없음.
  #   사람이 기다리는 요청이라 CPU 나눔 비율을 data-pipeline(1024)의 4배로. 4 CPU = worker 2 × 엔진 2(서버 CPU가 4 미만이면 cpus를 낮추고
  #   settings.yaml mcp_parse_engine_processes를 1로).
  mcp-data-parsing-0:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-data-parsing-0
    command: ["run-mcp-parsing"]
    environment: {SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0:/app/deploy:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output:/app/output:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    cpu_shares: 4096
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 1024
    healthcheck:                               # Redis PING + 이 컨테이너 소비자 heartbeat
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s
