# 운영 묶음(개발 서버의 출시 전 시험도 이것) — 구운 이미지(코드 포함) 컨테이너 3개 + 운영 서버의 PG·Redis(프로필 db — 개발 서버는 compose-dev.yml의 것).
#   폴더 ${PRD_DIR}/{app,home}: app에 settings.yaml·output, home → /root.
#   띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…]   (${PRD_DIR}/app에서) · PG·Redis: host_ctl.sh --profile db up -d
#   비밀번호 null 칸(root·PG·Redis)은 서버 사본에서만 채운다(git에 올리지 않음 — docs/operations/prd.md 3). 값의 $는 $$로.
name: sbl-prd
x-prd: &prd
  restart: always
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]
  pids_limit: 4096
  logging:
    options: {max-size: "50m", max-file: "3"}
x-ssh: &ssh
  <<: *prd
  configs: [{source: root_pw, target: /run/secrets/root_pw, mode: 0400}]
  entrypoint: ["/usr/bin/tini", "-s", "--", "/etc/devbox/dev_entry.sh"]   # 구운 이미지 ENTRYPOINT(entrypoint.sh) 대신 SSH 작업 공간으로

services:
  data-pipeline:
    <<: *ssh
    image: data-pipeline:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline
    command: ["devbox"]
    environment: {SSH_PORT: "8020", SETTINGS_FILE: /etc/rag/settings.yaml, APP_ENTRY: /opt/sbl/docker/entrypoint.sh}
    ports: ["0.0.0.0:8020:8020"]   # bridge — 컨테이너마다 자기 127.0.0.1(opencode 서버 4096이 벌끼리 섞이지 않게) · 서버의 PG·Redis·모델은 <서버 IP>로
    volumes:
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/output:/app/output:z
      - ${PRD_DIR:-/home/sbl/data_pipeline}/home:/root:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 16g

  mcp-server:
    <<: *ssh
    image: mcp-server:${IMAGE_TAG:-0.5.0}
    container_name: mcp-server
    network_mode: host   # 검색 MCP는 <서버 IP>:8051에 바로 바인드(search.server.mcp_bind_host)
    command: ["devbox", "mcp", "--set", "MCP_PORT=8051"]
    environment: {SSH_PORT: "8050", SETTINGS_FILE: /etc/rag/settings.yaml, APP_ENTRY: /opt/sbl/docker/entrypoint.sh}
    volumes:
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/output:/app/output:ro,z
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/output/_mcp_parse/jobs:/app/output/_mcp_parse/jobs:z   # parse_document 업로드·결과
      - ${PRD_DIR:-/home/sbl/data_pipeline}/home/mcp:/root:z
    cpus: 3
    mem_limit: 12g
    memswap_limit: 12g

  mcp-data-parsing:
    <<: *prd
    image: data-pipeline:${IMAGE_TAG:-0.5.0}
    container_name: mcp-data-parsing
    network_mode: host
    command: ["run-mcp-parsing"]
    environment: {SETTINGS_FILE: /etc/rag/settings.yaml}
    volumes:
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/data_pipeline}/app/output:/app/output:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    cpu_shares: 4096   # 사람이 기다리는 요청 — 파이프라인의 4배 몫
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s

  pgvector:   # 검색 DB — 계정은 데이터 폴더가 비었을 때 한 번만 쓰인다(settings.yaml required.pg와 같은 값). 메모리 값은 서버에 맞춰
    profiles: [db]
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    ports: ["0.0.0.0:5433:5432"]
    environment:
      POSTGRES_DB: null
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
    volumes:
      - ${PG_DATA:-/data/pg/pipeline}:/var/lib/postgresql/data:z
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=64MB
               -c maintenance_work_mem=2GB -c max_parallel_maintenance_workers=2
               -c max_parallel_workers_per_gather=2 -c max_connections=100
    shm_size: 3g
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options: {max-size: "50m", max-file: "3"}

  redis:   # parse_document 작업 큐(이미지 입구를 거쳐 redis 사용자로) — 비밀번호는 settings.yaml common.connections.redis.redis_password와 같은 값
    profiles: [db]
    image: redis:7.4.8-alpine
    container_name: redis
    restart: always
    environment:
      REDIS_PASSWORD: null
    command: ["sh", "-c", '[ -n "$$REDIS_PASSWORD" ] || { echo "[redis] REDIS_PASSWORD 칸이 비었음 — compose 파일에 채울 것" >&2; exit 1; }; exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --protected-mode yes --bind 0.0.0.0']
    ports: ["0.0.0.0:8010:6379"]
    volumes:
      - ${REDIS_DATA:-/data/redis}:/data:z
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG']
      interval: 15s
      timeout: 5s
      retries: 3
    pids_limit: 1024
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      options: {max-size: "20m", max-file: "3"}

configs:
  root_pw:   # SSH root 비밀번호(8자 이상) — 컨테이너 /run/secrets/root_pw
    content: null
