# 운영 서버 — 구운 이미지(코드 포함). 띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…]
name: sbl-prd
x-prd: &prd
  restart: always
  network_mode: host
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]
  pids_limit: 4096
  logging:
    options: {max-size: "50m", max-file: "3"}
x-ssh: &ssh
  <<: *prd
  entrypoint: ["/usr/bin/tini", "-s", "--", "/etc/devbox/dev_entry.sh"]

services:
  data-pipeline-0:
    <<: *ssh
    image: data-pipeline:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-0
    command: ["devbox"]
    environment: {SSH_PORT: "8020", SETTINGS_FILE: /etc/rag/settings.yaml, APP_ENTRY: /app/docker/entrypoint.sh}
    volumes:
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/output:/app/deploy/output:z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/home:/app/deploy/home:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 16g

  mcp-server-0:
    <<: *ssh
    image: mcp-server:${IMAGE_TAG:-0.4.0}
    container_name: mcp-server-0
    command: ["devbox", "mcp", "--set", "MCP_PORT=8051"]
    environment: {SSH_PORT: "8050", SETTINGS_FILE: /etc/rag/settings.yaml, APP_ENTRY: /app/docker/entrypoint.sh}
    volumes:
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/output:/app/deploy/output:ro,z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/output/_mcp_parse/jobs:/app/deploy/output/_mcp_parse/jobs:z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/home/mcp:/app/deploy/home:z
    cpus: 3
    mem_limit: 12g
    memswap_limit: 12g

  mcp-data-parsing-0:
    <<: *prd
    image: data-pipeline:${IMAGE_TAG:-0.4.0}
    container_name: mcp-data-parsing-0
    command: ["run-mcp-parsing"]
    environment: {SETTINGS_FILE: /etc/rag/settings.yaml}
    volumes:
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/settings.yaml:/etc/rag/settings.yaml:ro,z
      - ${PRD_DIR:-/home/sbl/sbl_data_parsing-main}/output:/app/deploy/output:z
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    cpu_shares: 4096
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s
