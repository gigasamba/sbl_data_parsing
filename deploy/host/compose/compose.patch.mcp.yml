# 덧씌우기 코드 연결 — 검색 MCP만(compose.mcp.yml 단독 사용 때, SI35). compose.patch.yml은 parse·structure·load·publish도 있어 mcp 파일과는 같이 못 씀.
#   docker compose -f compose.mcp.yml -f compose.patch.mcp.yml up -d     (코드 바꾼 뒤엔 restart mcp만)
#   /app/docker도 덮고 entrypoint는 bash로 직접 실행 — compose.patch.yml과 같은 이유(새 entrypoint 분기·ZIP 실행 비트).
services:
  mcp:
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]
    volumes:
      - ${PATCH_CODE:?PATCH_CODE=<덧씌우기 코드 폴더> 필요 — settings.yaml ops.host.patch_code(기본값 없음, 사용자 11-02)}/app/deploy/common:${APP_CODE_ROOT:?APP_CODE_ROOT 필요}/common:ro,z   # S3 — 공용 코드(refactor.md C-22: live에 폴더가 먼저 있어야 함)
      - ${PATCH_CODE:?PATCH_CODE=<덧씌우기 코드 폴더> 필요 — settings.yaml ops.host.patch_code(기본값 없음, 사용자 11-02)}/app/deploy/mcp_server:${APP_CODE_ROOT:?APP_CODE_ROOT 필요}/mcp_server:ro,z
      - ${PATCH_CODE:?PATCH_CODE=<덧씌우기 코드 폴더> 필요 — settings.yaml ops.host.patch_code(기본값 없음, 사용자 11-02)}/app/deploy/resources:${APP_CODE_ROOT:?APP_CODE_ROOT 필요}/resources:ro,z   # S2 — refactor.md C-20
      - ${PATCH_CODE:?PATCH_CODE=<덧씌우기 코드 폴더> 필요 — settings.yaml ops.host.patch_code(기본값 없음, 사용자 11-02)}/app/docker:/app/docker:ro,z
