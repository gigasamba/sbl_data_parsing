# PC 시험. 띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…]
name: sbl-local
x-local: &local
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: {SETTINGS_FILE: /app/deploy/settings.yaml}
  logging:
    options: {max-size: "20m", max-file: "3"}

services:
  data-pipeline-0:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-0
    command: ["idle"]
    volumes:
      - ../../..:/app/deploy:ro,z
      - ../../../output:/app/deploy/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g

  mcp-server-0:
    <<: *local
    image: mcp-server-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-server-0
    command: ["mcp", "--set", "MCP_PORT=8051", "--set", "MCP_HOST=auto"]
    ports: ["0.0.0.0:8051:8051"]
    volumes:
      - ../../..:/app/deploy:ro,z
      - ../../../output:/app/deploy/output:ro,z
      - ../../../output/_mcp_parse/jobs:/app/deploy/output/_mcp_parse/jobs:z
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g

  mcp-data-parsing-0:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-data-parsing-0
    command: ["run-mcp-parsing"]
    volumes:
      - ../../..:/app/deploy:ro,z
      - ../../../output:/app/deploy/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 2
    cpu_shares: 4096
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s
