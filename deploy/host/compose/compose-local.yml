# PC 묶음(시험): 0번 한 벌 — data-pipeline-0 + 검색 MCP mcp-server-0 + parse_document 작업 컨테이너 mcp-data-parsing-0. 재시작 정책 없음.
#   띄우기(저장소 루트에서): bash deploy/host/scripts/host_ctl.sh up -d [서비스…](settings.yaml required.env.run_env = local이면 이 파일)     내리기: … down
#   이미지: 실행 이미지(*-runtime — 코드 없음) + 저장소 폴더를 /app/deploy에 읽기 전용으로(코드·settings.yaml·edw_chain.yaml이 그 안).
#     PC 빌드: ALLOW_NO_ASSETS=1 BUILD_ONLY=1 IMAGE_TARGET=pipeline-runtime|mcp-runtime TAG=<이미지>-runtime:<판> bash deploy/release/build_ship.sh
#   컨테이너는 모두 root로 뜬다. PC(local)는 root SSH를 열지 않는다(dev_entry.sh가 dev·prd에서만) — 앱 명령만 돈다.
#   PG·Redis는 PC에 띄운 것(서버와 같은 compose-pgvector.yml·compose-redis.yml이나 PC 시험 DB)에 host.docker.internal로 붙는다.
#   검색 MCP: settings.yaml search.server — mcp_bind_host auto · mcp_port 8080 · required.tokens.mcp_token → PC에서 http://127.0.0.1:8051/mcp.
#   바꿀 자리: IMAGE_TAG(이미지 판) · DOC_SRC(원본 문서 폴더 — 기본 저장소의 valid_env/object_storage) — 셸 env나 이 파일 옆 .env
name: sbl-local                              # compose 묶음 이름
x-local: &local
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]   # 컨테이너에서 PC 자신(PG·Redis·모델)
  environment: {SETTINGS_FILE: /app/deploy/settings.yaml}
  logging:
    options: {max-size: "20m", max-file: "3"}

services:
  data-pipeline-0:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-0
    command: ["idle"]                         # 일 없이 떠 있음 — pipe_exec.sh·run_pipeline.py가 docker exec로
    volumes:
      - ../../..:/app/deploy:ro,z             # 저장소 폴더(이 파일 기준 세 단계 위)
      - ../../../output:/app/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g

  mcp-server-0:
    <<: *local
    image: mcp-server-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-server-0
    command: ["mcp"]
    ports: ["0.0.0.0:8051:8080"]              # HTTP 8051 → 8080
    volumes:
      - ../../..:/app/deploy:ro,z
      - ../../../output:/app/output:ro,z
      - ../../../output/_mcp_parse/jobs:/app/output/_mcp_parse/jobs:z   # parse_document 업로드·결과
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g

  mcp-data-parsing-0:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-data-parsing-0
    command: ["run-mcp-parsing"]
    volumes:
      - ../../..:/app/deploy:ro,z
      - ../../../output:/app/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 2
    cpu_shares: 4096
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 1024
    healthcheck:                               # Redis PING + 이 컨테이너 소비자 heartbeat
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s
