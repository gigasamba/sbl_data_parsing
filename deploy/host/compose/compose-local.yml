# PC 시험 — 운영 묶음과 같은 컨테이너 3개, 실행 이미지 + 이 저장소를 코드 폴더(/app, 읽기 전용)로 · 결과는 ./output.
#   띄우기: bash deploy/host/scripts/host_ctl.sh up -d [서비스…]   (저장소 루트에서)
name: sbl-local
x-local: &local
  init: true
  user: "0"
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: {SETTINGS_FILE: /app/settings.yaml}
  logging:
    options: {max-size: "20m", max-file: "3"}

services:
  data-pipeline:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: data-pipeline
    command: ["idle"]
    volumes:
      - ../../..:/app:ro,z
      - ../../../output:/app/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 12g

  mcp-server:
    <<: *local
    image: mcp-server-runtime:${IMAGE_TAG:-0.5.0}
    container_name: mcp-server
    command: ["mcp", "--set", "MCP_PORT=8051", "--set", "MCP_HOST=auto"]
    ports: ["0.0.0.0:8051:8051"]
    volumes:
      - ../../..:/app:ro,z
      - ../../../output:/app/output:ro,z
      - ../../../output/_mcp_parse/jobs:/app/output/_mcp_parse/jobs:z
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g

  mcp-data-parsing:
    <<: *local
    image: data-pipeline-runtime:${IMAGE_TAG:-0.5.0}
    container_name: mcp-data-parsing
    command: ["run-mcp-parsing"]
    volumes:
      - ../../..:/app:ro,z
      - ../../../output:/app/output:z
      - ${DOC_SRC:-../../../valid_env/object_storage}:/data/docs:ro,z
    cpus: 2
    cpu_shares: 4096
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "python", "-m", "pipeline.run_mcp_parsing", "--health"]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 15s
