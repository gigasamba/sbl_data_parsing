# parse_document Redis 큐(AOF) — 우리가 운영하는 루프백 전용 컨테이너.
#   기동 순서: 이 파일 → compose.data-parsing.yml → compose.mcp-server.yml.
#   ( . deploy/host/scripts/load_settings.sh && load_settings && $DOCKER compose -f deploy/host/compose/compose.redis.yml up -d )
#   접속·이미지·메모리·데이터 폴더는 settings.yaml, 셸 치환은 load_settings.sh(host_settings.tsv).
# host_ctl.sh/keepalive가 settings_to_env.py로 /conf/redis.conf·health.sh·start.sh(600)를 먼저 만든다.
#   redis_password가 있으면 requirepass를 config에만 씀. argv·compose env에 비밀번호를 쓰면 inspect·ps에 노출되므로 금지.
#   health는 보호 파일에서 REDISCLI_AUTH를 읽어 인증한다. 데이터 폴더의 호스트 접근 권한을 제한한다.
#   직접 compose로 띄우기 전에는 load_settings 뒤 prepare_redis를 부른다.
services:
  mcp-redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    container_name: mcp-redis
    network_mode: host
    restart: unless-stopped
    command: ["sh", "/conf/start.sh"]
    volumes:
      - ${REDIS_DATA_DIR:-${RAG_ROOT}/redis}:/data:z
      - ${REDIS_CONF_DIR:-${RAG_ROOT}/redis-conf}:/conf:ro,z
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "sh", "/conf/health.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: "20m", max-file: "3"}
