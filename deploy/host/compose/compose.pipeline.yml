# 파이프라인 컨테이너(docs/operations/server-guide.md §0) — 수집 서버. S6b(10-27, D-020 — 옛 compose.modules.yml): 파이프라인 이미지를
#   하나로 합쳐 서버 이미지는 2개 — data-pipeline(파싱·구조화·적재·게시, 옛 data-parsing+data-structure) · mcp-server(검색 MCP, 옛 data-retrieval).
#   파싱·구조화·적재·게시는 트리거(1회 실행 후 종료), 검색 MCP만 상주. job 서비스 이름(parse·structure·load·publish·
#   mcp)은 그대로(색인 비교용 index_a·index_b는 op-10에 compose.index.yml로 — 그 파일을 덧붙일 때만 INDEX_CONF_DIR 필요), 상주 컨테이너 이름은 새 이름(사용자 10-27): data-pipeline-parse·data-pipeline-structure(옛 data-parsing·
#   data-structure — 같은 data-pipeline 이미지(11-01부터 둘 다 `idle` — trigger 서버 지움, pl-10), run_docs.py의 docker exec 대상) · mcp-server(옛 data-retrieval).
#   준비(저장소 루트에서): docker build -f deploy/docker/Dockerfile --target pipeline -t data-pipeline:<태그> . ·
#                          --target mcp -t mcp-server:<태그> .
#   트리거(순서대로, 앞 모듈 끝 표시가 있어야 다음이 시작 — 없으면 종료 코드 3): bash deploy/host/scripts/trigger.sh parse|structure|load|all
#   compose를 직접 부를 때(S7e1 — 셸에 설정 값을 먼저 export, 옛 --env-file pipeline.env 대신). 하위 셸 ( … )로 — 대화형 셸에 export해 두면
#   그 뒤 settings.yaml을 고쳐도 그 셸에는 안 먹음(VS7e1 R-2):
#     ( . deploy/host/scripts/settings_env.sh && load_settings && docker compose -f deploy/host/compose/compose.pipeline.yml run --rm parse )
#       (인자를 주면 명령을 덮으므로: run --rm parse parse --max-new 100) · 같은 꼴로 run --rm structure · run --rm load · up -d mcp
# 결과 폴더(RAG_OUT)를 모든 모듈이 같이 씀 — 모듈 사이 전달은 이 폴더의 파일(+ PostgreSQL)뿐, 서로 직접 부르지 않음.
# 주의: `docker compose config`는 치환한 값을 그대로 출력함 — 확인은 `config --quiet`만(S7e1부터 비밀은 compose에 없지만 호스트 경로·이름이 나옴).
# 이미지 변수: DATA_PIPELINE_IMAGE·MCP_SERVER_IMAGE(S6b 새 이름) — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE·DATA_RETRIEVAL_IMAGE·RAG_*_IMAGE·
#   RAG_IMAGE는 별칭으로 읽지 않는다 — trigger.sh·run_tool.sh·mcp_up.sh(image_vars.sh)가 새 이름이 비고 옛 이름만 있으면 "새 이미지 판 필요"로
#   멈춘다(코디네이터 답 Q2 a). compose를 직접 부를 때는 image 줄의 `:?` 메시지가 같은 안내를 낸다(S6c — VS6b R-11).
# S7e1(사용자 10-27 Q1·Q3, D-028 ⑭) — 옛 pipeline.env 통째 넘기기(비밀까지 컨테이너 env에)를 없앴다. 서비스마다 설정 파일 하나를 읽기 전용으로
#   붙이고 env는 SETTINGS_FILE·RUN_ENV만 넘긴다(docker inspect에 비밀 없음). 앱이 붙인 파일에서 common + 자기 앱 절을 읽는다(전환 기간에는 다리가
#   프로세스 env로 — U-a). compose 치환 값(이미지·자원·포트·호스트 경로)은 셸 env에서 — deploy/host/scripts/settings_env.sh의 load_settings가
#   settings.yaml 호스트 칸을 export(trigger.sh·run_tool.sh·mcp_up.sh·systemd가 부름). YAML에 없는 칸은 아래 ${X:-기본값}이 그대로 걸린다.
#   파일 권한: 컨테이너 사용자 UID 10001이 읽어야 함 — 주인 10001·그룹 운영 계정 그룹·640(운영 계정 UID가 10001이면 600 — refactor.md C-09, Q2).
#   값 바꾸기(S7e3 — 사용자 10-28): 앱 설정 값은 settings.yaml을 직접 고친다(한 번만 다르게 돌릴 값도 — 고쳐 돌리고 되돌림). 셸·`-e`로 준 옛 env
#   이름은 앱이 읽지 않고(S7e2), 덮기 파일 도구 `python -m common.config.overrides`는 PC 전용이라 서버에서는 종료 2(이 compose는 SETTINGS_FILE 한 파일만
#   붙여 덮기 파일의 base가 컨테이너 안에 없음 — VS7e2 B-2). 셸 env로 덮을 수 있는 것은 compose 치환 값(이미지·자원·포트·호스트 경로)뿐.
x-settings: &settings "${SETTINGS_FILE:?SETTINGS_FILE=<settings.yaml 절대 경로> 필요 — deploy/host/scripts/settings_env.sh load_settings가 export(refactor.md C-09)}:/etc/rag/settings.yaml:ro,z"
x-job: &job
  network_mode: host                       # PostgreSQL·모델 API에 서버 주소 그대로(NETWORK_HOST=1)
  init: true
  environment: {NETWORK_HOST: "1", SETTINGS_FILE: /etc/rag/settings.yaml, RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"}
  profiles: ["job"]                        # `up`으로는 안 뜸 — run --rm(트리거)로만
  pids_limit: 2048
  logging:
    options: {max-size: "50m", max-file: "3"}

services:
  parse:                                   # ① 파싱(1회 job): dedup → prepare → 파싱(문서마다 엔진 동시) → 채점 → 대표 결과(_rep) · 임베딩·DB 없음
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["parse"]
    volumes:
      - *settings
      - ${DOC_SRC:?DOC_SRC=<원본 문서 폴더>}:/data/docs:ro,z
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${PARSE_MEM_LIMIT:-16g}
    memswap_limit: ${PARSE_MEM_LIMIT:-16g}
    cpus: ${PARSE_CPUS:-3}

  # 11-01(pl-10 — trigger 서버 지움) — 상주 컨테이너(일 없이 떠 있음, entrypoint `idle`): run_docs.py가 docker exec로 문서별 작업을,
  # MCP parse_document 작업 서비스(mcp_parse_service)도 이 안에서 돈다. 이름 data-pipeline-parse(S6b — 옛 data-parsing).
  data-pipeline-parse:
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    container_name: data-pipeline-parse
    command: ["idle"]
    restart: unless-stopped
    network_mode: host                      # PostgreSQL·모델 API·parse_document 작업 서비스(127.0.0.1)에 서버 주소 그대로
    init: true
    environment:
      SETTINGS_FILE: /etc/rag/settings.yaml      # S7e1 — 붙인 설정 파일(x-settings)
      RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"   # S7a(D-028) — 실행 환경 필수(없으면 compose가 멈춤)
    volumes:
      - *settings
      - ${DOC_SRC:?DOC_SRC=<원본 문서 폴더>}:/data/docs:ro,z
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${PARSE_MEM_LIMIT:-16g}
    memswap_limit: ${PARSE_MEM_LIMIT:-16g}
    cpus: ${PARSE_CPUS:-3}
    pids_limit: 2048
    logging:
      options: {max-size: "50m", max-file: "3"}

  structure:                               # ② 구조화: _rep → 청킹·사실·고객·그래프·임베딩(API·캐시) → output/edw/bundle · 원본 없어도 됨
                                           #   (output/prepared가 실제 파일이면 글자 PDF 위치(bbox)도 — 원본 링크(symlink)면 rep.source로)
                                           #   S6b: 이미지가 data-pipeline으로(옛 data-structure)
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["structure"]
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    memswap_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    cpus: ${STRUCTURE_CPUS:-2}

  load:                                    # ③ 적재(1회 job): 묶음 → PostgreSQL(pgvector), 옛 기록 정리 · PG 없으면 종료 코드 4 · S6b: data-pipeline(옛 data-structure)
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["load"]
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${LOAD_MEM_LIMIT:-4g}
    memswap_limit: ${LOAD_MEM_LIMIT:-4g}
    cpus: ${LOAD_CPUS:-1}

  # 11-01(pl-10) — 상주 컨테이너(일 없이 떠 있음, entrypoint `idle`) — run_docs.py가 docker exec로 구조화·적재. 이름 data-pipeline-structure(S6b — 옛 data-structure).
  data-pipeline-structure:
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    container_name: data-pipeline-structure
    command: ["idle"]
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      SETTINGS_FILE: /etc/rag/settings.yaml      # S7e1 — 붙인 설정 파일(x-settings)
      RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"   # S7a(D-028) — 실행 환경 필수(없으면 compose가 멈춤)
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    memswap_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    cpus: ${STRUCTURE_CPUS:-2}
    pids_limit: 2048
    logging:
      options: {max-size: "50m", max-file: "3"}

  publish:                                 # SI39: 대표 결과(.md) Object Storage 업로드 + EDW AI.ParsingMeta — 맨 마지막 별도 단계, 자동 스케줄 없음(트리거만) · S6b: data-pipeline(옛 data-structure, load.parsing_meta)
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["publish"]
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
    mem_limit: ${PUBLISH_MEM_LIMIT:-2g}
    memswap_limit: ${PUBLISH_MEM_LIMIT:-2g}
    cpus: ${PUBLISH_CPUS:-1}

  mcp:                                     # ④ 검색 MCP(상주) — compose.mcp.yml과 같음 · S6b: 이미지·컨테이너 mcp-server
    image: ${MCP_SERVER_IMAGE:?MCP_SERVER_IMAGE=mcp-server:<태그> 필요 — 옛 DATA_RETRIEVAL_IMAGE·RAG_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    container_name: mcp-server             # S6b(사용자 10-27) — 옛 data-retrieval(그 전 rag-mcp)
    command: ["mcp"]
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      SETTINGS_FILE: /etc/rag/settings.yaml      # S7e1 — 붙인 설정 파일(x-settings)
      RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"   # S7a(D-028) — 실행 환경 필수(없으면 compose가 멈춤)
      # S7e2(사용자 10-28) — 바인드·포트·저장소·질의 캐시는 settings.yaml search.server.host·port · required.deploy.mcp_store · common.models.embed.query_cache(op-08)(옛 env MCP_HOST·MCP_PORT·MCP_STORE·
      #   EMBED_QUERY_CACHE — 질의 캐시는 이미지 안 기본 /tmp/mcp_query_cache.sqlite). 서버 yaml에 store: pg를 적음(없으면 자동 탐지 — C-45)
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:ro,z
    mem_limit: ${MCP_MEM_LIMIT:-4g}
    cpus: ${MCP_CPUS:-1}             # mcp(상주) + parse(최대 PARSE_CPUS 3) ≤ 4 vCPU 개발 서버 — 2였으면 5로 넘침(D4)
    pids_limit: 512
    healthcheck:                     # 이미지에 curl 없음 — python 한 줄(/health, 토큰 불필요)
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://${MCP_HOST:-127.0.0.1}:${MCP_PORT:-8765}/health', timeout=3)"]   # S7e2 — 주소·포트는 compose 치환(load_settings)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options: {max-size: "20m", max-file: "3"}
