# parse_document 작업 서비스 전용 컨테이너 mcp-data-parsing(PRD rn-03) — 컨테이너마다 compose 파일 하나: 일괄 data-pipeline은
#   compose.pipeline.yml, 검색 MCP는 compose.mcp-server.yml. 같은 이미지(DATA_PIPELINE_IMAGE)·같은 설정 파일·같은 결과 폴더.
#   띄우기(하위 셸로 — 대화형 셸에 export해 두면 그 뒤 settings.yaml을 고쳐도 그 셸에는 안 먹음):
#     ( . deploy/host/scripts/load_settings.sh && load_settings && $DOCKER compose -f deploy/host/compose/compose.data-parsing.yml up -d )
#   개발 서버(실행 이미지)는 -f deploy/host/compose/compose.code.data-parsing.yml을 덧붙임 · mcp_keepalive.sh(타이머 2분마다)가 꺼져 있으면 이 파일로 띄움.
#   설정·env 규칙은 compose.pipeline.yml 머리말과 같다(설정 파일 읽기 전용 마운트 + SETTINGS_FILE·RUN_ENV만).
x-settings: &settings "${SETTINGS_FILE:?SETTINGS_FILE=<settings.yaml 절대 경로> 필요 — deploy/host/scripts/load_settings.sh load_settings가 export(refactor.md C-09)}:/etc/rag/settings.yaml:ro,z"
services:
  # MCP parse_document 작업 서비스 전용: 사람이 기다리는 요청이라 일괄 컨테이너와 떼고 CPU 나눔 비율을 높게 준다.
  #   작업 서비스(pipeline.parse_service — 127.0.0.1:8766, 토큰 settings.yaml)가 이 컨테이너의 주 프로세스라 죽으면 restart가 다시 띄운다
  #   작업 폴더는 결과 폴더 _mcp_parse/jobs(run_docs.py가 보고 medium 레인 양보).
  #   8766을 쓰는 다른 프로세스가 없어야 뜬다(release-and-patch §8-3 7).
  #   자원 칸: settings.yaml ops.pipeline_host.data_parsing_cpus·data_parsing_mem_limit·data_parsing_cpu_shares(DATA_PARSING_* — 비우면 아래 기본값과 같은 값).
  mcp-data-parsing:
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    container_name: mcp-data-parsing${NAME_SUFFIX:-}
    command: ["parse-service"]
    restart: unless-stopped
    network_mode: host                      # 검색 MCP(mcp-server)가 127.0.0.1:8766으로 부름
    init: true
    environment:
      SETTINGS_FILE: /etc/rag/settings.yaml
      RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"
    volumes:
      - *settings
      - ${DOC_SRC:?DOC_SRC=<원본 문서 폴더>}:${APP_DOCS_MOUNT:?APP_DOCS_MOUNT 필요 — load_settings.sh load_settings가 냄}:ro,z   # data-pipeline과 같은 자리 — data_parsing.roots에 문서 폴더를 적은 서버
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:${APP_OUTPUT_ROOT:?APP_OUTPUT_ROOT 필요 — load_settings.sh load_settings가 냄}:z
    mem_limit: ${DATA_PARSING_MEM_LIMIT:-8g}
    memswap_limit: ${DATA_PARSING_MEM_LIMIT:-8g}
    cpus: ${DATA_PARSING_CPUS:-3}                 # 작업 서비스 기본 병렬 수(min(3, CPU-1)) — 줄이면 settings.yaml tuning.ops.services.data_parsing.procs도 그 이하로
    cpu_shares: ${DATA_PARSING_CPU_SHARES:-4096}   # data-pipeline(1024)의 4배 — CPU가 모자랄 때 먼저 받음(cgroup v2는 cpu.weight로 바뀜)
    pids_limit: 1024
    healthcheck:                     # 작업 서비스 /health(토큰 불필요) — 포트는 ops.runtime.data_parsing_port(load_settings가 냄)
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://127.0.0.1:${DATA_PARSING_PORT:-8766}/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options: {max-size: "50m", max-file: "3"}
