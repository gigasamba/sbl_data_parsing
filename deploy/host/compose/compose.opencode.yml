# 개발 작업 공간의 opencode 설정(선택): settings.yaml option.devbox.opencode_config(DEVBOX_OPENCODE_CONFIG — 호스트 파일)를
#   읽기 전용으로 붙이고 OPENCODE_CONFIG로 가리킨다. host_ctl.sh가 compose.dev.yml과 함께일 때만 더한다.
#   비우면 이 파일을 쓰지 않고 홈의 ~/.config/opencode/opencode.json(첫 시작에 이미지의 틀을 복사 — 내부망 모델만)을 쓴다.
services:
  data-pipeline:
    environment:
      OPENCODE_CONFIG: /etc/devbox/opencode.user.json
    volumes:
      - ${DEVBOX_OPENCODE_CONFIG:?DEVBOX_OPENCODE_CONFIG 필요 — settings.yaml option.devbox.opencode_config}:/etc/devbox/opencode.user.json:ro,z
