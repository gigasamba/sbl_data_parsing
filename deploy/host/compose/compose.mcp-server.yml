# 검색 MCP 서버 — mcp-server 이미지, 명령 mcp. 결과 폴더는 읽기 전용(검색은 PG만 — 묶음 폴더는 안 읽음).
#   bash deploy/host/scripts/mcp_keepalive.sh(상주 확인·기동) · 직접(하위 셸로 — 현재 셸에 설정 env를 남기지 않게): ( . deploy/host/scripts/load_settings.sh && load_settings && docker compose -f deploy/host/compose/compose.mcp-server.yml up -d )
# 네트워크: 호스트 네트워크(Linux) — PostgreSQL·임베딩 API에 서버 주소 그대로 붙고, MCP는 MCP_HOST(127.0.0.1 또는 사내 대역 IP)에만 열림.
#   루프백이 아닌 주소면 MCP_TOKEN 필수(클라이언트 Authorization: Bearer). 0.0.0.0은 거부.
# 이미지 변수 MCP_SERVER_IMAGE·컨테이너 이름 MCP_CNAME(기본 mcp-server — ops.containers.mcp.mcp_container_name).
# 설정 파일 붙이기·compose 치환 값·파일 권한·값 바꾸기 규칙은 compose.pipeline.yml 머리 주석과 같다(설정 파일 하나를 읽기 전용으로, env는 SETTINGS_FILE·RUN_ENV만).
x-settings: &settings "${SETTINGS_FILE:?SETTINGS_FILE=<settings.yaml 절대 경로> 필요 — deploy/host/scripts/load_settings.sh load_settings가 export(refactor.md C-09)}:/etc/rag/settings.yaml:ro,z"
services:
  mcp:
    image: ${MCP_SERVER_IMAGE:?MCP_SERVER_IMAGE=mcp-server:<태그> 필요 — 옛 DATA_RETRIEVAL_IMAGE·RAG_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    container_name: ${MCP_CNAME:?MCP_CNAME 필요 — load_settings.sh load_settings가 냄(ops.containers.mcp.mcp_container_name + 벌 번호)}
    command: ["mcp"]
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      SETTINGS_FILE: /etc/rag/settings.yaml      # 붙인 설정 파일(x-settings)
      RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"   # 실행 환경 필수(없으면 compose가 멈춤)
      # 바인드·포트·질의 캐시는 settings.yaml search.server.mcp_bind_host·mcp_port · common.models.embed.embed_query_cache_file
      #   (질의 캐시는 이미지 안 기본 /tmp/mcp_query_cache.sqlite). 저장소는 PG 하나.
    volumes:
      - *settings
      # EDW 조인 사슬 서버 사본(data-pipeline과 같은 파일): search attrs 거르기·근거 attrs 키. 앱은 ops.paths.edw_chain_file(적재와 같은 칸)에 이 경로를 적었을 때만 씀.
      - ${EDW_CHAIN_SRC:?EDW_CHAIN_SRC 필요 — load_settings.sh load_settings가 냄(ops.host.host_edw_chain_file, 비우면 <루트>/edw_chain.yaml)}:/etc/rag/edw_chain.yaml:ro,z
      - ${RAG_OUT:?RAG_OUT=<결과 폴더(파이프라인 /app/output)>}:${APP_OUTPUT_ROOT:?APP_OUTPUT_ROOT 필요 — load_settings.sh load_settings가 냄}:ro,z
    mem_limit: ${MCP_MEM_LIMIT:-4g}
    cpus: ${MCP_CPUS:-1}             # mcp(상주) + data-pipeline(PARSE_CPUS) — 4 vCPU 개발 서버는 parse_cpus 3 이하로(settings.yaml)
    pids_limit: 512
    healthcheck:                     # 이미지에 curl 없음 — python 한 줄(/health, 토큰 불필요)
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://${MCP_HOST:-127.0.0.1}:${MCP_PORT:-8765}/health', timeout=3)"]   # 주소·포트는 compose 치환(load_settings)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options: {max-size: "20m", max-file: "3"}
