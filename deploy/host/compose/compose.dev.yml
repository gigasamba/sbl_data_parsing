# 개발 작업 공간(선택 — 개발 서버 dev만): data-pipeline을 개발자의 SSH 작업 공간으로 띄운다.
#   host_ctl.sh가 settings.yaml option.devbox.ssh_port(DEVBOX_SSH_PORT)를 적었을 때만 compose.code*.yml 뒤에 더한다(prd면 거부).
#   - 명령 `devbox`: 이미지의 dev_entry.sh가 sshd를 컨테이너 사용자(rag, UID 10001)로 띄움 — 열쇠 로그인만(<루트>/home/.ssh/authorized_keys).
#     network_mode: host라 포트 게시 없이 서버의 그 포트에서 바로 듣는다(개발자마다 다른 포트).
#   - 코드 폴더: compose.code.yml과 같은 자리(APP_CODE_ROOT)에 쓰기 가능으로 붙여 그 읽기 전용 마운트를 바꾼다
#     (mcp-data-parsing·mcp는 같은 코드 폴더를 읽기 전용 그대로 — 고친 코드는 그 컨테이너를 다시 띄우면 반영).
#   - 홈: <루트>/home(ssh_port를 적은 뒤 host_ctl.sh init이 만듦 — 10001, 700)을 /home/rag로 — SSH 열쇠·opencode 설정·작업 기록이 남는다.
#   - git 계정(option.devbox.gitea_*·git_user_*): 이미지의 /etc/devbox/git_cred.py가 붙인 설정 파일에서 직접 읽어 ~/.git-credentials를 씀(토큰은 env로 안 넘김).
#   - 루트 = 코드 폴더라 쓰기 가능한 코드 마운트 안에 settings.yaml·edw_chain.yaml이 있다 — 그 자리에 읽기 전용으로 다시 붙여
#     작업 공간(사람·opencode)이 호스트 스크립트·타이머가 읽는 설정을 고치지 못하게 한다.
services:
  data-pipeline:
    command: ["devbox"]
    environment:
      SSH_PORT: "${DEVBOX_SSH_PORT:?DEVBOX_SSH_PORT 필요 — settings.yaml option.devbox.ssh_port}"
    volumes:
      - ${CODE_DIR:?CODE_DIR 필요 — 개발 작업 공간은 실행 이미지(*-runtime)에서만}:${APP_CODE_ROOT:?APP_CODE_ROOT 필요 — load_settings.sh load_settings가 냄}:z
      - ${RAG_ROOT:?RAG_ROOT 필요 — load_settings.sh load_settings가 냄}/home:/home/rag:z
      - ${SETTINGS_FILE:?SETTINGS_FILE 필요 — load_settings.sh load_settings가 냄}:${APP_CODE_ROOT}/settings.yaml:ro,z
      - ${RAG_ROOT}/edw_chain.yaml:${APP_CODE_ROOT}/edw_chain.yaml:ro,z
