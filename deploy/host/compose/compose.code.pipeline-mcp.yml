# 개발 서버 parse_document 전용 컨테이너(실행 이미지 data-pipeline-runtime — op-06): 서버 코드 폴더(CODE_DIR)를 /app/deploy에 읽기 전용으로.
#   docker compose -f compose.pipeline-mcp.yml -f compose.code.pipeline-mcp.yml up -d   (mcp_up.sh는 실행 이미지면 덧붙임)
#   이 파일 없이 실행 이미지를 띄우면 runtime_entry.sh가 바로 멈춘다(종료 2).
x-code: &code
  - ${CODE_DIR:?CODE_DIR=<코드 폴더 — 저장소 트리 그대로> 필요(op-06)}:${APP_CODE_ROOT:?APP_CODE_ROOT 필요 — settings_env.sh load_settings가 냄}:ro,z

services:
  data-pipeline-mcp: {volumes: *code}
