# Redis(op-19): 서버마다 1개 — 이미지 sbl-redis:<판>(deploy/docker/Dockerfile.redis — 공식 redis 7.4.8 + 노드 설정).
#   포트: 8010(REDIS_PORT) — 서버의 모든 주소(0.0.0.0)에 연다.
#   비밀번호 = <SBL_ROOT>/redis_pw 첫 줄(" 와 \ 는 못 씀) — env·명령 인자에 두지 않는다. 데이터 = REDIS_DATA(기본 /data/redis).
#   띄우기: docker compose -f compose-redis.yml up -d     내리기: … down(데이터 폴더는 그대로)
#   바꿀 자리: SBL_ROOT(기본 /home/sbl) · IMAGE_TAG(sbl-redis 판) · REDIS_PORT · REDIS_DATA — 셸 env나 이 파일 옆 .env
name: sbl-redis
services:
  redis:
    image: sbl-redis:${IMAGE_TAG:-0.4.0}
    container_name: redis
    restart: always
    environment:
      REDIS_PORT: "${REDIS_PORT:-8010}"
    ports: ["0.0.0.0:${REDIS_PORT:-8010}:${REDIS_PORT:-8010}"]
    volumes:
      - ${REDIS_DATA:-/data/redis}:/data:z
      - {type: bind, source: "${SBL_ROOT:-/home/sbl}/redis_pw", target: /run/secrets/redis_pw, read_only: true,
         bind: {create_host_path: false, selinux: z}}
    pids_limit: 1024
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      options: {max-size: "20m", max-file: "3"}
