# parse_document 작업 큐. 띄우기(코드 폴더 맨 위): docker compose --env-file .env -f deploy/host/compose/compose-redis.yml up -d
name: sbl-redis
services:
  redis:
    image: redis:7.4.8-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?.env에 REDIS_PASSWORD 필요}", "--appendonly", "yes",
              "--appendfsync", "everysec", "--protected-mode", "yes", "--bind", "0.0.0.0"]
    ports: ["0.0.0.0:8010:6379"]
    volumes:
      - ${REDIS_DATA:-/data/redis}:/data:z
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='${REDIS_PASSWORD}' redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
    pids_limit: 1024
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      options: {max-size: "20m", max-file: "3"}
