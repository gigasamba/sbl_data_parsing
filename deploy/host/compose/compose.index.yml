# AD41 색인 설정 비교(index_a·index_b) — op-10(10-31): compose.pipeline.yml에서 떼어 냄. 그 파일에 있으면 `${INDEX_CONF_DIR:?}`가
#   모든 compose 실행(podman-compose는 쓰지 않는 서비스까지 치환)을 막았다. 쓸 때만 덧붙인다(pl-19에서 지울 예정):
#   ( . deploy/host/scripts/settings_env.sh && load_settings && INDEX_CONF_DIR=<a.json·b.json 폴더> \
#       $DOCKER compose -f deploy/host/compose/compose.index.yml run --rm index_a )
#   코드가 든 이미지(data-pipeline:<태그>)용 — 개발 서버 실행 이미지(코드 없음)에서는 쓰지 않는다.
#   x-settings·x-job은 compose.pipeline.yml과 같은 글자(compose 파일 사이에 YAML 앵커를 나눌 수 없어 복사).
x-settings: &settings "${SETTINGS_FILE:?SETTINGS_FILE=<settings.yaml 절대 경로> 필요 — deploy/host/scripts/settings_env.sh load_settings가 export(refactor.md C-09)}:/etc/rag/settings.yaml:ro,z"
x-job: &job
  network_mode: host                       # PostgreSQL·모델 API에 서버 주소 그대로(NETWORK_HOST=1)
  init: true
  environment: {NETWORK_HOST: "1", SETTINGS_FILE: /etc/rag/settings.yaml, RUN_ENV: "${RUN_ENV:?RUN_ENV=dev|prd 필요 — settings.yaml required.env.run_env(load_settings가 export — refactor.md C-34, D-028)}"}
  profiles: ["job"]                        # `up`으로는 안 뜸 — run --rm(트리거)로만
  pids_limit: 2048
  logging:
    options: {max-size: "50m", max-file: "3"}


services:
  # AD41 — 같은 data-pipeline 이미지(S6b — 옛 data-structure)로 설정이 다른 색인을 나란히(예: 청크 크기) 띄우는 예시. index_a·index_b는
  # 기본 structure·load 트리거 대신 pipeline/load/index.py(entrypoint의 범용 `tool index` 경유 — S6c에 찾는 목록에 더함, 그 전엔 "모르는 도구")로 색인을 짓는다 — index_id(설정
  # 지문)가 달라지므로 같은 PG에 스키마 <PG_SCHEMA>_<index_id>로 나란히 쌓인다(서로 안 덮음). 평소엔 안 씀 —
  # 여러 설정을 비교·운영할 때만 `docker compose run --rm index_a`처럼 따로 불러서(트리거 순서 밖, profiles: job).
  index_a:
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["tool", "index", "build", "--conf", "/app/output/index-conf/a.json", "--pg"]
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
      - ${INDEX_CONF_DIR:?INDEX_CONF_DIR=<색인 설정 json 폴더 — a.json·b.json>}:/app/output/index-conf:ro,z
    mem_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    cpus: ${STRUCTURE_CPUS:-2}

  index_b:                                 # index_a와 같은 이미지·다른 설정 파일(청크 크기 등) — "2개 이상 인스턴스" 예시
    <<: *job
    image: ${DATA_PIPELINE_IMAGE:?DATA_PIPELINE_IMAGE=data-pipeline:<태그> 필요 — 옛 DATA_PARSING_IMAGE·DATA_STRUCTURE_IMAGE는 S6b에 바뀜(refactor.md C-29)}
    command: ["tool", "index", "build", "--conf", "/app/output/index-conf/b.json", "--pg"]
    volumes:
      - *settings
      - ${RAG_OUT:?RAG_OUT=<결과 폴더>}:/app/output:z
      - ${INDEX_CONF_DIR:?INDEX_CONF_DIR=<색인 설정 json 폴더 — a.json·b.json>}:/app/output/index-conf:ro,z
    mem_limit: ${STRUCTURE_MEM_LIMIT:-8g}
    cpus: ${STRUCTURE_CPUS:-2}
