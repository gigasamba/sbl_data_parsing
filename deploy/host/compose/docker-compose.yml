# 개발 서버 시험 묶음(op-18 — 개발 서버만): 벌 0·1의 data-pipeline + 벌 0의 mcp-server를 한 파일로 띄운다.
#   컨테이너는 root로 뜨고 root 비밀번호 SSH를 연다(비밀번호 = <SBL_ROOT>/root_pw 첫 줄 — 시작할 때마다 다시 건다).
#   실행 환경은 벌 settings.yaml required.env.run_env — dev가 아니면 컨테이너가 시작을 거부한다.
#   host_ctl.sh와 따로 쓴다 — 같은 벌을 두 길로 띄우지 않는다(컨테이너 이름 data-pipeline-0·mcp-server-0이 host_ctl 벌 0과 같다). 준비·접속 순서: docs/operations/server-guide.md §6-6
#   띄우기: docker compose -f deploy/host/compose/docker-compose.yml up -d     내리기: … down
#   바꿀 자리: SBL_ROOT(벌 폴더들의 위 폴더 — 기본 /home/sbl) · IMAGE_TAG(이미지 판) · DOC_SRC(원본 문서 폴더) — 셸 env나 이 파일 옆 .env
#     컨테이너마다 ports(서버 포트:컨테이너 포트)·cpus·mem_limit·memswap_limit(메모리+스왑 합 — 같으면 스왑 안 씀)는 아래 각 칸에 직접 적는다
#     (모든 컨테이너의 cpus 합 ≤ 서버 CPU 수 — server-guide §0-2 ②). 벌을 늘리려면 data-pipeline-1 칸을 복사해 번호·포트·폴더를 바꾼다.
#   네트워크: docker 자체 네트워크(bridge) — 포트를 서버의 모든 주소(0.0.0.0)에 연다. 컨테이너 안 127.0.0.1은 컨테이너 자신이라
#     PG·모델 주소는 서버 주소로(PG는 host.docker.internal:<PG 포트> — pgvector도 0.0.0.0으로 열어 둠 · settings.yaml required.pg).
name: sbl-devset                             # compose 묶음 이름 — host_ctl.sh 묶음과 따로
x-dev: &dev
  restart: unless-stopped
  init: true
  user: "0"                                   # root — 벌 폴더에 쓰는 파일도 root 소유가 됨
  extra_hosts: ["host.docker.internal:host-gateway"]   # 컨테이너에서 서버 자신(PG 등)
  pids_limit: 4096
  logging:
    options: {max-size: "50m", max-file: "3"}

services:
  data-pipeline-0:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-0
    command: ["devbox"]
    ports: ["0.0.0.0:8020:22"]                # SSH: 서버 8020 → 컨테이너 22
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0:/app/deploy:z                         # 벌 폴더 전체(코드 — 쓰기 가능)
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/settings.yaml:/app/deploy/settings.yaml:ro,z   # 설정은 읽기 전용
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output:/app/output:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/home:/root:z                          # root 홈 — SSH 호스트 열쇠·git 계정·작업 기록
      - {type: bind, source: "${SBL_ROOT:-/home/sbl}/root_pw", target: /run/secrets/root_pw, read_only: true,
         bind: {create_host_path: false, selinux: z}}   # 비밀번호 파일 — 없거나 비면 컨테이너가 시작 거부(종료 2)
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 4
    mem_limit: 12g
    memswap_limit: 16g

  data-pipeline-1:
    <<: *dev
    image: data-pipeline-runtime:${IMAGE_TAG:-0.4.0}
    container_name: data-pipeline-1
    command: ["devbox"]
    ports: ["0.0.0.0:8021:22"]
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1:/app/deploy:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/settings.yaml:/app/deploy/settings.yaml:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/output:/app/output:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-1/home:/root:z
      - {type: bind, source: "${SBL_ROOT:-/home/sbl}/root_pw", target: /run/secrets/root_pw, read_only: true,
         bind: {create_host_path: false, selinux: z}}   # 비밀번호 파일 — 없거나 비면 컨테이너가 시작 거부(종료 2)
      - ${DOC_SRC:-/data/docs}:/data/docs:ro,z
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g

  # 벌 0의 검색 MCP — 벌 0과 같은 코드·설정·결과(결과는 읽기 전용), 홈만 따로(home/mcp). `devbox mcp` = sshd + MCP 서버.
  #   벌 0 settings.yaml search.server: host auto · port 8080 · token(필수 — 루프백이 아니라서) · allowed_hosts <서버 IP>:8051
  mcp-server-0:
    <<: *dev
    image: mcp-server-runtime:${IMAGE_TAG:-0.4.0}
    container_name: mcp-server-0
    command: ["devbox", "mcp"]
    ports: ["0.0.0.0:8050:22", "0.0.0.0:8051:8080"]   # SSH 8050 → 22 · HTTP 8051 → 8080
    environment: {SSH_PORT: "22", SETTINGS_FILE: /app/deploy/settings.yaml}
    volumes:
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0:/app/deploy:z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/settings.yaml:/app/deploy/settings.yaml:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/output:/app/output:ro,z
      - ${SBL_ROOT:-/home/sbl}/sbl_data_parsing-main-0/home/mcp:/root:z
      - {type: bind, source: "${SBL_ROOT:-/home/sbl}/root_pw", target: /run/secrets/root_pw, read_only: true,
         bind: {create_host_path: false, selinux: z}}   # 비밀번호 파일 — 없거나 비면 컨테이너가 시작 거부(종료 2)
    cpus: 3
    mem_limit: 12g
    memswap_limit: 12g
